VIEWS.clientes = () => hub('clientes', [['lista', 'Clientes', clientesMain], ['cobrar', 'Por cobrar', () => VIEWS.cxc()]]);
VIEWS.cxc = () => {
  const ss = S.sales.filter(s => s.status !== 'anulada' && s.balance > 0).sort((a, b) => (a.dueTs || 0) - (b.dueTs || 0)); const now = Date.now();
  const venc = ss.filter(s => s.dueTs < now), porv = ss.filter(s => s.dueTs >= now);
  const by = {}; ss.forEach(s => { by[s.customerId] = (by[s.customerId] || 0) + s.balance; });
  return `<div class="stack"><div class="sect-h"><div><h2>Cuentas por cobrar</h2><p>Cada abono reduce el saldo de una venta existente y aumenta la caja o el banco por el importe recibido. Nunca se registra como venta nueva.</p></div></div>
  <div class="kpis"><div class="kpi hero"><span class="lb">Total por cobrar</span><span class="vl">${money(arTotal())}</span><span class="sub">${ss.length} ventas</span></div><div class="kpi alert"><span class="lb">Vencido</span><span class="vl">${money(venc.reduce((a, s) => a + s.balance, 0))}</span><span class="sub">${venc.length} ventas</span></div><div class="kpi"><span class="lb">Por vencer</span><span class="vl">${money(porv.reduce((a, s) => a + s.balance, 0))}</span><span class="sub">${porv.length} ventas</span></div></div>
  <div class="grid split2"><div class="card" style="min-width:0">${ss.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Venta</th><th>Cliente</th><th>Fecha</th><th>Vence</th><th class="r">Total</th><th class="r">Saldo</th><th></th></tr></thead><tbody>${ss.map(s => `<tr><td class="b"><a href="#" data-a="go" data-r="venta" data-id="${s.id}">${s.num}</a></td><td>${esc(custName(s.customerId))}</td><td class="small">${fDate(s.ts)}</td><td>${s.dueTs < now ? `<span class="pill bad">Vencida ${fDate(s.dueTs)}</span>` : `<span class="pill">${fDate(s.dueTs)}</span>`}</td><td class="r">${money(s.total)}</td><td class="r b bad">${money(s.balance)}</td><td><button class="btn sm okb" data-a="abonoForm" data-id="${s.id}" ${dis('cxc')}>Abonar</button></td></tr>`).join('')}</tbody></table></div>` : emptyState('inbox', 'No hay cuentas por cobrar', 'Todas las ventas están pagadas.')}</div>
  <div class="card"><div class="card-h"><h3>Por cliente</h3></div><div class="card-b">${hbars(Object.entries(by).map(([k, v]) => ({ k, l: custName(k), v })).sort((a, b) => b.v - a.v))}</div></div></div></div>`;
};
VIEWS.cxp = () => {
  const ps = S.purchases.filter(p => p.status === 'recibida' && p.balance > 0); const es = S.expenses.filter(e => e.status !== 'anulado' && e.balance > 0);
  const rows = [...ps.map(p => ({ t: 'Compra', num: p.num, who: (supplier(p.supplierId) || {}).name, ts: p.ts, due: p.dueTs, total: p.total, bal: p.balance, a: 'payPurchaseForm', id: p.id })), ...es.map(e => ({ t: 'Gasto', num: e.num, who: e.desc, ts: e.ts, due: e.dueTs, total: e.amount, bal: e.balance, a: 'payExpenseForm', id: e.id }))].sort((a, b) => a.due - b.due);
  const now = Date.now();
  return `<div class="stack"><div class="sect-h"><div><h2>Cuentas por pagar</h2><p>Compras recibidas a crédito y gastos pendientes. La caja solo baja cuando registras el pago.</p></div></div>
  <div class="kpis"><div class="kpi hero"><span class="lb">Total por pagar</span><span class="vl">${money(apTotal())}</span><span class="sub">${rows.length} documentos</span></div><div class="kpi"><span class="lb">Proveedores</span><span class="vl">${money(ps.reduce((a, p) => a + p.balance, 0))}</span><span class="sub">${ps.length} compras</span></div><div class="kpi"><span class="lb">Gastos pendientes</span><span class="vl">${money(es.reduce((a, e) => a + e.balance, 0))}</span><span class="sub">${es.length} gastos</span></div></div>
  <div class="card">${rows.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Tipo</th><th>Número</th><th>Proveedor / concepto</th><th>Fecha</th><th>Vence</th><th class="r">Total</th><th class="r">Saldo</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td><span class="pill">${r.t}</span></td><td class="b">${r.num}</td><td>${esc(r.who)}</td><td class="small">${fDate(r.ts)}</td><td>${r.due < now ? `<span class="pill bad">Vencida</span>` : `<span class="small">${fDate(r.due)}</span>`}</td><td class="r">${money(r.total)}</td><td class="r b bad">${money(r.bal)}</td><td><button class="btn sm okb" data-a="${r.a}" data-id="${r.id}" ${dis('cxp')}>Pagar</button></td></tr>`).join('')}</tbody></table></div>` : emptyState('outbox', 'No hay cuentas por pagar', '')}</div></div>`;

const REP_TABS = [['ventas', 'Ventas'], ['productos', 'Productos y combos'], ['margen', 'Margen'], ['metodos', 'Métodos de pago'], ['descuentos', 'Descuentos y devoluciones'], ['resultado', 'Costo, ganancia y gastos'], ['inventario', 'Existencias'], ['consumo', 'Consumo de materias primas'], ['mermas', 'Mermas'], ['compras', 'Compras'], ['cxc', 'Por cobrar'], ['cxp', 'Por pagar'], ['flujo', 'Flujo de caja']];
VIEWS.reportes = () => {
  const st = vs('reportes', { p: 'mes', tab: 'ventas', g: 'dia' }); const [from, to, label] = rangeOf(st); const p = pnl(from, to);
  let body = '', csv = null;
  const T = (head, rows, foot) => `<div class="tblwrap"><table class="tbl"><thead><tr>${head.map((h, i) => `<th class="${i && typeof rows[0]?.[i] === 'number' ? 'r' : ''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map((c, i) => `<td class="${typeof c === 'number' ? 'r' : ''}">${typeof c === 'number' ? (head[i].includes('%') ? pct(c) : head[i].match(/Cant|Unid|#/) ? nfmt(c, 2) : money(c)) : esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${head.length}" class="muted">Sin datos en el período</td></tr>`}</tbody>${foot ? `<tfoot><tr>${foot.map((c, i) => `<td class="${typeof c === 'number' ? 'r' : ''}">${typeof c === 'number' ? (head[i].match(/Cant|Unid|#/) ? nfmt(c, 2) : money(c)) : esc(c)}</td>`).join('')}</tr></tfoot>` : ''}</table></div>`;
  const fmtRow = r => r.map(c => typeof c === 'number' ? r2(c) : c);
  if (st.tab === 'ventas') {
    const key = s => st.g === 'mes' ? monthKey(s.ts) : st.g === 'semana' ? (() => { const dk = dayKey(s.ts); const wd = (new Date(dk + 'T12:00:00Z').getUTCDay() + 6) % 7; return addDays(dk, -wd); })() : dayKey(s.ts);
    const g = {}; p.ss.forEach(s => { const k = key(s); g[k] = g[k] || [0, 0, 0, 0]; g[k][0]++; g[k][1] += s.total; g[k][2] += s.cogs; g[k][3] += s.paid; });
    const rows = Object.keys(g).sort().map(k => [st.g === 'mes' ? fMonth(k) : st.g === 'semana' ? 'Semana del ' + fDay(k) : fDay(k), g[k][0], g[k][1], g[k][2], g[k][1] - g[k][2], g[k][3]]);
    const head = ['Período', '# Ventas', 'Ventas netas', 'Costo de ventas', 'Ganancia bruta', 'Cobrado en la venta'];
    body = `<div class="chips mb">${[['dia', 'Por día'], ['semana', 'Por semana'], ['mes', 'Por mes']].map(([k, l]) => `<button class="chip ${st.g === k ? 'on' : ''}" data-a="vsSet" data-v="reportes" data-k="g" data-val="${k}">${l}</button>`).join('')}</div>${barChart(Object.keys(g).sort().map(k => ({ k, l: st.g === 'mes' ? fMonth(k) : fDay(k), v: r2(g[k][1]) })))}<div class="mt">${T(head, rows, ['Total', p.count, p.net, p.cogs, p.grossProfit, rows.reduce((a, r) => a + r[5], 0)])}</div>`;
    csv = [head, ...rows.map(fmtRow)];
  } else if (st.tab === 'productos' || st.tab === 'margen') {
    const g = {}; p.ss.forEach(s => s.lines.forEach(l => { const x = g[l.productId] = g[l.productId] || { n: l.name, q: 0, v: 0, c: 0, d: 0 }; x.q += l.qty; x.v += l.total; x.c += l.cost; x.d += l.discount; }));
    const ents = Object.entries(g).sort((a, b) => b[1].v - a[1].v);
    if (st.tab === 'productos') { const head = ['Producto o combo', 'Cant. vendida', 'Ventas', 'Descuentos de línea', '% de las ventas']; const rows = ents.map(([id, x]) => [x.n, x.q, x.v, x.d, p.net ? x.v / p.net : 0]);
      body = `${hbars(ents.map(([k, x]) => ({ k, l: x.n, v: r2(x.v) })))}<div class="mt">${T(head, rows, ['Total', rows.reduce((a, r) => a + r[1], 0), rows.reduce((a, r) => a + r[2], 0), rows.reduce((a, r) => a + r[3], 0), ''])}</div><p class="small muted">Los descuentos generales del ticket (${money(p.ss.reduce((a, s) => a + s.discount, 0))}) se restan en el total de ventas netas.</p>`; csv = [head, ...rows.map(fmtRow)]; }
    else { const head = ['Producto o combo', 'Cant. vendida', 'Precio promedio', 'Costo promedio', 'Ganancia por unidad', 'Ganancia total', 'Margen %']; const rows = ents.map(([id, x]) => [x.n, x.q, x.v / x.q, x.c / x.q, (x.v - x.c) / x.q, x.v - x.c, x.v ? (x.v - x.c) / x.v : 0]);
      body = `${hbars(ents.map(([k, x]) => ({ k, l: x.n, v: x.v ? (x.v - x.c) / x.v : 0 })).sort((a, b) => b.v - a.v), { fmt: pct })}<div class="mt">${T(head, rows)}</div><p class="small muted">El costo de cada venta se guarda al momento de venderla; cambiar recetas o precios de ingredientes no altera estas cifras.</p>`; csv = [head, ...rows.map(fmtRow)]; }
  } else if (st.tab === 'metodos') {

  } else if (st.tab === 'resultado') {

  } else if (st.tab === 'inventario') {

  const L = (a, b, cls = '') => `<div class="sumline ${cls}"><span>${a}</span><span>${b}</span></div>`;

  else if (st.tab === 'resultados') { const p = pnl(from, to);
    body = `<div class="card pad" style="max-width:640px">${L('Ventas brutas', money(p.gross))}${L('− Descuentos', money(-p.disc))}${L('<b>Ventas netas</b>', '<b>' + money(p.net) + '</b>')}${L('− Costo de ventas', money(-p.cogs))}${L('Ganancia bruta', money(p.grossProfit), 'tot')}${L('<span class="muted">Margen bruto</span>', pct(p.net ? p.grossProfit / p.net : 0))}
      <div class="mt"><b>Gastos operativos</b></div>${Object.entries(p.byCat).map(([k, v]) => L('− ' + esc(k), money(-v))).join('') || L('<span class="muted">Sin gastos</span>', money(0))}${L('Total gastos operativos', money(-p.opex))}${L('± Ajustes de inventario', money(p.invAdj))}${L('± Diferencias de caja', money(p.cashDiff))}${L('Resultado operativo', money(p.result), 'tot')}</div>
      <p class="small muted">Basado en ventas netas, costo de ventas y gastos del período (devengado), no en el dinero cobrado. Las adquisiciones de activos no son gasto del período.</p>`; }
  else if (st.tab === 'flujo') { const cf = cashFlow(from, to);
    body = `<div class="card pad" style="max-width:640px">${L('Saldo inicial (caja + banco)', money(cf.start))}<div class="mt"><b>Entradas</b></div>${Object.entries(cf.g).filter(([k, v]) => v > 0 && k !== 'traspaso').map(([k, v]) => L(MOVE_TYPE[k] || k, money(v))).join('')}<div class="mt"><b>Salidas</b></div>${Object.entries(cf.g).filter(([k, v]) => v < 0 && k !== 'traspaso').map(([k, v]) => L(MOVE_TYPE[k] || k, money(v))).join('')}${L('Flujo neto del período', money(cf.net), 'tot')}${L('Saldo final (caja + banco)', money(cf.end), 'tot')}</div><p class="small muted">Solo movimientos reales de dinero. Las ventas a crédito aparecen cuando se cobran.</p>`; }
  else { const b = balanceSheet(); const ok = Math.abs(b.diff) < 0.05;
    body = `<div class="note ${ok ? 'ok' : 'bad'} mb">${ok ? `Activos (${money(b.assets)}) = Pasivos (${money(b.liab)}) + Patrimonio (${money(b.equity)}). La ecuación contable se cumple.` : 'La ecuación no cuadra por ' + money(b.diff) + '. Revisa los escenarios de prueba.'}</div>
    <div class="grid g2"><div class="card pad"><h3>Activos</h3>${L('Efectivo en caja', money(b.caja))}${L('Banco y otros métodos', money(b.banco))}${L('Inventario', money(b.inv))}${L('Cuentas por cobrar', money(b.ar))}${L('Equipos y activos adquiridos', money(b.fa))}${L('Total activos', money(b.assets), 'tot')}</div>
    <div class="card pad"><h3>Pasivos</h3>${L('Cuentas por pagar a proveedores', money(b.apPurch))}${L('Gastos pendientes de pago', money(b.apExp))}${L('Deudas a plazos', money(b.debts))}${L('Total pasivos', money(b.liab), 'tot')}<h3 class="mt">Patrimonio</h3>${L('Capital inicial (saldo de apertura demo)', money(b.capital))}${L('+ Aportes del propietario', money(b.aportes))}${L('− Retiros del propietario', money(-b.retiros))}${L('+ Resultado acumulado', money(b.result))}${b.debtAdj ? L('± Deudas que ya tenías al empezar', money(b.debtAdj)) : ''}${L('Total patrimonio', money(b.equity), 'tot')}${L('<b>Pasivos + Patrimonio</b>', '<b>' + money(b.liab + b.equity) + '</b>')}</div></div>

};

ACT.cvCat = el => { CV.cat = el.dataset.k; render(); };
ON.cvSearch = el => { CV.q = el.value; render(); };

ACT.cvQty = el => { CV.pick.qty = Math.max(1, CV.pick.qty + +el.dataset.d); render(); };
ACT.cvAdd = () => { const p = prod(CV.pick.productId); if (CV.pick.flavors.filter(Boolean).length !== (+p.sauces || 0)) return toast('Elige todas las salsas', 'bad'); CV.cart.push(CV.pick); CV.step = 'list'; toast(p.name + ' agregado'); render(); };
ACT.cvBack = () => { CV.step = 'list'; render(); };
ACT.cvCart = () => { CV.step = 'cart'; render(); };
ACT.cvDel = el => { CV.cart.splice(+el.dataset.i, 1); render(); };

      + sec('Inventario al vender', '', `<label class="optrow"><span class="ol" style="display:block"><b>Permitir vender aunque falte inventario</b><br><span class="small muted">Útil al empezar, si todavía no registraste todas tus existencias. El inventario quedará en negativo y te avisará para que registres la compra o la producción.</span></span><input type="checkbox" id="cfNeg" ${c.allowNegative ? 'checked' : ''} data-on="cfgSet" data-k="allowNegative" data-b="1" ${e}></label>`) + sec('Métodos de pago', 'Indica si el dinero entra a la caja (efectivo) o al banco.', cfgOld('pagos'));
  } else if (st.tab === 'catalogo') body = cfgOld('categorias') + `<div class="mt"></div>` + sec('Unidades de medida', '', cfgOld('unidades'));
  else if (st.tab === 'precios') body = sec('Precios de venta', 'Cambia precios rápido. Las ventas ya registradas conservan su precio.', cfgOld('precios')) + `<div class="mt"></div>` + sec('Stock mínimo', 'Cuando un artículo baja de este número aparece la alerta de existencias bajas.', cfgOld('minimos'));
  else if (st.tab === 'comprobante') body = sec('Comprobante de venta', '', cfgOld('comprobante'));
  else if (st.tab === 'usuarios') body = VIEWS.usuarios();
  else if (st.tab === 'android') body = androidGuide();
  else if (st.tab === 'respaldo') body = backupView();
  else body = sec('Exportar y respaldar', 'Reporte en Excel del día o del mes, y respaldo completo para restaurar.', `<button class="btn pri" data-a="exportOpen">${ic('download')} Exportar o respaldar</button>`) + `<div class="mt"></div>` + (typeof CS_DATA !== 'undefined' ? sec('Recetas e inventario de Churro Sensei', S.csImport ? `Cargados el ${fDT(S.csImport.ts)} desde ${esc(CS_DATA.source)}. Volver a cargarlos no duplica ni sobrescribe nada: solo crea lo que falte.` : `Carga de una vez los ${csData(CS_DATA).items.length} artículos, ${csData(CS_DATA).recipes.length} recetas, sabores y menú del Excel. Sin existencias (las cuentas tú) y con las recetas en su estado original.`, `<button class="btn ${S.csImport ? '' : 'pri'}" data-a="csImportOpen" ${e}>${ic('download')} ${S.csImport ? 'Revisar o volver a cargar' : 'Ver vista previa y cargar'}</button>${S.csValidations ? ` <button class="btn" data-a="setupVal">Validaciones del Excel</button>` : ''}`) + `<div class="mt"></div>` + sec('Bitácora', 'Autorizaciones de venta, aprobaciones de recetas e importaciones.', auditHTML()) + `<div class="mt"></div>` : '') + sec('Cómo se guardan tus datos', '', cfgOld('datos')) + `<div class="mt"></div>` + sec('Empezar de nuevo', EDITION === 'prod' ? 'Borra todo y empieza en blanco. Antes exporta una copia de seguridad.' : 'Úsalo cuando quieras dejar la demostración y cargar tu propio negocio.', `<div class="grid g2"><div class="card pad" style="box-shadow:none"><b>Empezar en blanco</b><p class="small muted">Borra productos, inventario, ventas y demás registros. Conserva el nombre, colores y configuración.</p><button class="btn pri" data-a="blankStart" ${e}>Empezar en blanco</button></div>${EDITION === 'prod' ? '' : `<div class="card pad" style="box-shadow:none"><b>Volver a la demostración</b><p class="small muted">Genera otra vez los datos ficticios de ejemplo.</p><button class="btn" data-a="resetDemo" ${e}>${ic('refresh')} Cargar demostración</button></div>`}</div><button class="btn mt" data-a="wizard">Abrir el asistente inicial</button> <button class="btn mt" data-a="go" data-r="pruebas">${ic('flask')} Pruebas del sistema</button>`);
  return `<div class="stack"><div class="sect-h"><div><h2>Configuración</h2><p>Personaliza el sistema para tu negocio. Los cambios se aplican de inmediato.</p></div></div><div class="tabs">${tabs.map(([k, l]) => `<button class="tab ${st.tab === k ? 'on' : ''}" data-a="tab" data-v="config" data-k="${k}">${l}</button>`).join('')}</div><div class="stack" style="gap:14px">${body}</div></div>`;
};
ACT.accentSet = el => { if (!can('config')) return; S.config.accent = el.dataset.k; applyBrand(); save(); render(); };
ON.accentPick = el => { if (!can('config')) return; S.config.accent = el.value; applyBrand(); save(); clearTimeout(ON._ap); ON._ap = setTimeout(render, 250); };
ACT.toneSet = el => { S.config.tone = el.dataset.k; applyBrand(); save(); render(); };
ON.ownerName = el => { const n = el.value.trim(); if (!n) return; curUser().name = n; save(); clearTimeout(ON._on); ON._on = setTimeout(render, 700); };
ACT.blankStart = () => confirmBox('Empezar en blanco', 'Se borrarán todos los productos, inventario, ventas, compras, gastos, clientes y movimientos. Se conservan el nombre, los colores y la configuración. Esta acción no se puede deshacer.', 'Borrar y empezar', () => { blankState(); afterReset('Listo. Empieza agregando tus productos e insumos.'); }, true);
function afterReset(msg) { setNumFmt(); applyTheme(); applyBrand(); save(); UI.cart = { lines: [], customerId: '', discount: 0, payments: [], orderId: null }; UI.stack = []; UI.testResults = {}; UI.vs = {}; RX = null; PF = null; go('inicio', null, { root: true }); toast(msg); }
function blankState() {
  const keep = clone(S.config); const owner = clone(curUser());
  S = baseState(); S.demo = false; S.config.allowNegative = true;
  Object.assign(S.config, keep, { productCats: keep.productCats && keep.productCats.length ? keep.productCats : ['General'], setupDone: true });
  S.users = [Object.assign(owner, { id: 'u1', role: 'admin' })]; S.userId = 'u1';
  S.customers = [{ id: 'c0', name: 'Cliente de mostrador', phone: '', notes: '', creditLimit: 0, createdAt: Date.now() }];
}
/* ---- asistente inicial ---- */
let WZ = null;
ACT.wizard = () => openWizard(false);
function openWizard(first) {
  WZ = { mode: first && typeof CS_DATA !== 'undefined' && !S.csImport ? 'cs' : 'keep', name: S.config.name, owner: curUser().name, slogan: S.config.slogan, accent: S.config.accent || '#FF7A1A', currency: S.config.currency, first };
  openModal({ title: first ? 'Bienvenido' : 'Asistente inicial', size: 'wide', body: wizardBody(), foot: `${first ? '' : '<button class="btn" data-a="closeModal">Cancelar</button>'}<button class="btn pri lg" data-a="wizDone">${ic('check')} Empezar a usar</button>` });
}
function wizardBody() {
  const W = WZ; const opt = (k, t, d) => `<button class="card pad" style="text-align:left;cursor:pointer;box-shadow:none;border-color:${W.mode === k ? 'var(--accent)' : 'var(--line)'};background:${W.mode === k ? 'var(--accent-soft)' : 'var(--sunk)'};color:var(--fg)" data-a="wizMode" data-k="${k}"><b>${t}</b><div class="small muted" style="margin-top:4px">${d}</div></button>`;
  return `<p class="muted" style="margin-top:0">Configura en un minuto el nombre y los colores de tu negocio. Todo se puede cambiar después en Configuración.</p>
    <div class="small b muted" style="margin:14px 0 8px">1. ¿Con qué datos quieres empezar?</div>
    <div class="grid g3">${opt('keep', S.demo ? 'Explorar con la demostración' : 'Seguir con mis datos', S.demo ? 'Productos, inventario y ventas de ejemplo para probar todo.' : 'Mantener lo que ya registraste.')}${typeof CS_DATA !== 'undefined' && !S.csImport ? opt('cs', 'Mis datos de Churro Sensei', 'Inventario, recetas y menú del Excel ya cargados. Tú solo haces el conteo inicial.') : ''}${opt('blank', 'Empezar en blanco', 'Sin productos ni ventas. Ideal para cargar tu negocio real.')}${opt('restore', 'Restaurar una copia de seguridad', 'Recupera tus datos desde el archivo guardado en Drive o Archivos. Toca Empezar a usar y elígelo.')}${S.demo || EDITION === 'prod' ? '' : opt('demo', 'Cargar la demostración', 'Reemplaza tus datos por los de ejemplo.')}</div>
    <div class="small b muted" style="margin:18px 0 8px">2. Tu negocio</div>
    <div class="fgrid"><label class="f">Nombre del negocio<input class="in" id="wzName" value="${esc(W.name)}" data-on="wzSet" data-k="name" placeholder="Ej.: Mi Cafetería"></label><label class="f">Tu nombre<input class="in" id="wzOwner" value="${esc(W.owner)}" data-on="wzSet" data-k="owner" placeholder="Ej.: María"></label><label class="f">Eslogan<input class="in" id="wzSlogan" value="${esc(W.slogan)}" data-on="wzSet" data-k="slogan" placeholder="Ej.: Sabor que enamora"></label><label class="f">Símbolo de moneda<input class="in" id="wzCur" value="${esc(W.currency)}" data-on="wzSet" data-k="currency"></label></div>
    <div class="small b muted" style="margin:18px 0 8px">3. Color principal</div>
    <div class="row" style="gap:10px">${COLOR_PRESETS.map(([hex, n]) => `<button class="swatch ${W.accent.toLowerCase() === hex.toLowerCase() ? 'on' : ''}" style="--sw:${hex}" data-a="wizAccent" data-k="${hex}" aria-label="${n}" title="${n}"></button>`).join('')}<label class="swatch custom" title="Color personalizado"><input type="color" value="${esc(W.accent)}" data-on="wizAccentPick" aria-label="Color personalizado"></label></div>`;
}
ACT.wizMode = el => { WZ.mode = el.dataset.k; if (WZ.mode === 'cs') { WZ.name = WZ.name || 'Churro Sensei'; } if (WZ.mode === 'blank' && S.demo && WZ.name === 'Churro Sensei') { WZ.name = ''; WZ.slogan = ''; } setModalBody(wizardBody()); };
ON.wzSet = el => { WZ[el.dataset.k] = el.value; };
ACT.wizAccent = el => { WZ.accent = el.dataset.k; S.config.accent = WZ.accent; applyBrand(); setModalBody(wizardBody()); };
ON.wizAccentPick = el => { WZ.accent = el.value; S.config.accent = WZ.accent; applyBrand(); };
ACT.wizDone = () => {
  const W = WZ; if (W.mode === 'restore') { const inp = document.createElement('input'); inp.type = 'file'; inp.style.display = 'none'; document.body.appendChild(inp); inp.onchange = () => { const f = inp.files[0]; inp.remove(); if (f) restorePick(f); }; inp.click(); return; }
  if (!W.name.trim()) return modalErr('Escribe el nombre de tu negocio.'); if (!W.owner.trim()) return modalErr('Escribe tu nombre.');
  if (W.mode === 'demo') seedDemo(); if (W.mode === 'blank') blankState();
  if (W.mode === 'cs') { try { csImport(CS_DATA, { replace: true }); } catch (e) { return modalErr(e.message); } }
  Object.assign(S.config, { name: W.name.trim(), slogan: W.slogan.trim(), accent: W.accent, currency: W.currency.trim() || 'C$', setupDone: true });
  const admin = S.users.find(u => u.role === 'admin') || S.users[0]; admin.name = W.owner.trim(); S.userId = admin.id;
  closeModal(); afterReset(W.mode === 'blank' ? 'Listo. Empieza agregando tus productos en Catálogo.' : W.mode === 'cs' ? 'Tus datos están cargados. Empieza por el conteo inicial.' : `Bienvenido, ${W.owner.trim().split(' ')[0]}.`);
};
ON.cfgSet = el => { if (!can('config')) return; const k = el.dataset.k; S.config[k] = el.dataset.b ? el.checked : el.dataset.n ? (+el.value || 0) : el.value; if (k === 'numFmt') setNumFmt(); if (k === 'name') applyBrand(); save(); clearTimeout(ON._cf); ON._cf = setTimeout(() => { render(); }, el.tagName === 'SELECT' || el.dataset.b ? 0 : 700); };
ON.cfgLogo = el => { const f = el.files[0]; if (f) resizeImage(f, 256, url => { S.config.logo = url; save(); render(); toast('Logo actualizado'); }); };
ACT.cfgLogoDel = () => { S.config.logo = ''; save(); render(); };
ON.payMAcc = el => run('config', () => { S.config.payMethods[+el.dataset.i].account = el.value; }, 'Método actualizado');
ACT.payMToggle = el => run('config', () => { const m = S.config.payMethods[+el.dataset.i]; m.active = !m.active; }, 'Método actualizado');
ACT.payMAdd = () => run('config', () => { const n = val('pmNew').trim(); if (!n) throw ERR('Escribe el nombre del método'); S.config.payMethods.push({ id: uid('m'), name: n, account: 'banco', active: true }); }, 'Método agregado');
ACT.catAdd = el => run('config', () => { const n = val('catNew_' + el.dataset.k).trim(); if (!n) throw ERR('Escribe el nombre'); if (S.config[el.dataset.k].includes(n)) throw ERR('Ya existe'); S.config[el.dataset.k].push(n); }, 'Categoría agregada');
ACT.catDel = el => run('config', () => { const k = el.dataset.k, i = +el.dataset.i; const n = S.config[k][i]; const used = k === 'productCats' ? S.products.some(p => p.cat === n) : S.expenses.some(x => x.cat === n); if (used) throw ERR(`“${n}” está en uso y no se puede quitar`); S.config[k].splice(i, 1); }, 'Categoría eliminada');
ON.priceSet = el => { if (!can('productos')) return; const p = prod(el.dataset.id); const v = +el.value; if (v >= 0) { p.price = v; save(); clearTimeout(ON._ps); ON._ps = setTimeout(() => { render(); toast('Precio de ' + p.name + ': ' + money(v)); }, 800); } };
ON.minSet = el => { if (!can('inventario')) return; item(el.dataset.id).min = Math.max(0, +el.value || 0); save(); clearTimeout(ON._ms); ON._ms = setTimeout(render, 800); };
ACT.themeSet = el => { S.config.theme = el.dataset.k; applyTheme(); save(); render(); };
ACT.exportJSON = () => backupJSON();
ON.importJSON = el => { const f = el.files[0]; el.value = ''; if (f) restorePick(f); };
ACT.resetDemo = () => confirmBox('Restablecer datos', 'Se borrarán todos los cambios y se generarán de nuevo los datos ficticios de demostración.', 'Restablecer', () => { const keep = { accent: S.config.accent, tone: S.config.tone, theme: S.config.theme }; seedDemo(); Object.assign(S.config, keep, { setupDone: true }); applyBrand(); setNumFmt(); applyTheme(); save(); UI.cart = { lines: [], customerId: '', discount: 0, payments: [], orderId: null }; UI.stack = []; UI.testResults = {}; RX = null; go('inicio', null, { root: true }); toast('Datos de demostración restablecidos'); }, true);

/* ======================= ESCENARIOS DE PRUEBA ======================= */
VIEWS.pruebas = () => {
  const st = vs('pruebas', { real: false }); const R = UI.testResults;
  const done = Object.values(R); const pass = done.filter(r => r.ok).length;
  const fmtV = (r, v) => typeof v === 'boolean' ? (v ? 'Sí' : 'No') : typeof v === 'string' ? v : r.kind === 'money' ? money4(v) : nfmt(v, 3);
  return `<div class="stack"><div class="sect-h"><div><h2>Escenarios de prueba</h2><p>Cada escenario ejecuta operaciones reales del sistema y compara el resultado esperado con el calculado. Si no coinciden, la prueba se marca como fallida.</p></div><div class="row">${S.demo ? `<label class="row small"><input type="checkbox" id="tReal" ${st.real ? 'checked' : ''} data-on="vsSet" data-v="pruebas" data-k="real" ${dis('pruebas')}> Aplicar cambios a los datos demo</label>` : ''}<button class="btn pri" data-a="testAll">${ic('play')} Ejecutar todas</button></div></div>
  <div class="note ${st.real ? 'warn' : ''}">${st.real ? 'Las operaciones de prueba se guardarán en tus datos de demostración y aparecerán en ventas, inventario, caja y reportes.' : (S.demo ? 'Modo seguro: las pruebas se ejecutan sobre una copia de la demostración y no cambian tus datos. Marca la casilla si quieres ver las operaciones en los demás módulos.' : 'Las pruebas se ejecutan sobre una copia de la demostración, así nunca tocan los datos de tu negocio.')}</div>
  ${done.length ? `<div class="kpis"><div class="kpi ${pass === done.length ? 'good' : 'alert'}"><span class="lb">Superadas</span><span class="vl">${pass} de ${done.length}</span><span class="sub">${done.length < SCENARIOS.length ? (SCENARIOS.length - done.length) + ' sin ejecutar' : 'Todas ejecutadas'}</span></div></div>` : ''}
  <div class="stack" style="gap:10px">${SCENARIOS.map(sc => { const r = R[sc.id]; return `<div class="test ${r ? (r.ok ? 'pass' : 'fail') : ''}"><div class="th"><span class="idx">${sc.id}</span><div class="grow"><div class="row sb"><b>${esc(sc.name)}</b><span class="row">${r ? (r.ok ? '<span class="pill ok">Superada</span>' : '<span class="pill bad">Fallida</span>') : '<span class="pill">Sin ejecutar</span>'}<button class="btn sm" data-a="testRun" data-id="${sc.id}">${ic('play')} Ejecutar</button></span></div><div class="small muted">${esc(sc.desc)}</div></div></div>
    ${r ? `<div style="padding:0 16px 14px">${r.error ? `<div class="note bad">Error: ${esc(r.error)}</div>` : `<div class="tblwrap"><table class="tbl"><thead><tr><th>Comprobación</th><th class="r">Esperado</th><th class="r">Calculado</th><th></th></tr></thead><tbody>${r.rows.map(x => `<tr><td>${esc(x.label)}</td><td class="r">${fmtV(x, x.expected)}</td><td class="r b">${fmtV(x, x.actual)}</td><td>${x.ok ? '<span class="pill ok">✓</span>' : '<span class="pill bad">✗</span>'}</td></tr>`).join('')}</tbody></table></div>
      <details class="mt"><summary class="small" style="cursor:pointer">Reportes antes y después de la operación</summary><div class="tblwrap mt"><table class="tbl"><thead><tr><th>Indicador</th><th class="r">Antes</th><th class="r">Después</th><th class="r">Cambio</th></tr></thead><tbody>${[['ventas', 'Ventas netas (todo)'], ['nVentas', 'Cantidad de ventas'], ['caja', 'Efectivo en caja'], ['banco', 'Banco'], ['cxc', 'Cuentas por cobrar'], ['cxp', 'Cuentas por pagar'], ['inventario', 'Valor del inventario'], ['resultado', 'Resultado acumulado'], ['cuadre', 'Activos − (Pasivos + Patrimonio)']].map(([k, l]) => `<tr><td>${l}</td><td class="r">${k === 'nVentas' ? r.before[k] : money(r.before[k])}</td><td class="r">${k === 'nVentas' ? r.after[k] : money(r.after[k])}</td><td class="r b">${k === 'nVentas' ? r.after[k] - r.before[k] : money(r.after[k] - r.before[k])}</td></tr>`).join('')}</tbody></table></div><p class="small muted">${r.real ? 'Ejecutada sobre tus datos demo: revisa los reportes para ver los cambios.' : 'Ejecutada sobre una copia: tus datos no cambiaron.'}</p></details>`}</div>` : ''}</div>`; }).join('')}</div></div>`;
};
function doTest(id) { const st = vs('pruebas', {}); const real = !!st.real && can('pruebas') && S.demo; const sc = SCENARIOS.find(s => s.id === +id); const r = runScenario(sc, real); r.real = real; UI.testResults[sc.id] = r; if (real) save(); return r; }
ACT.testRun = el => { const r = doTest(el.dataset.id); render(); toast(r.ok ? `Escenario ${r.id} superado` : `Escenario ${r.id} falló`, r.ok ? 'ok' : 'bad'); };
ACT.testAll = () => { let ok = 0; SCENARIOS.forEach(s => { if (doTest(s.id).ok) ok++; }); render(); toast(`${ok} de ${SCENARIOS.length} escenarios superados`, ok === SCENARIOS.length ? 'ok' : 'bad'); };

/* ======================= ARRANQUE ======================= */
async function boot() {
  const had = await loadAsync(); if (!had) { if (EDITION === 'prod') freshProdState(); else seedDemo(); saveNow(); }
  migrate();
  setNumFmt(); applyTheme(); applyBrand();
  document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el || el.disabled) return; const f = ACT[el.dataset.a]; if (!f) return; if (el.tagName === 'A') e.preventDefault(); f(el, e); });
  document.addEventListener('input', e => { const el = e.target; if (!el.dataset || !el.dataset.on || el.tagName === 'SELECT' || ['checkbox', 'file', 'date', 'datetime-local', 'color'].includes(el.type)) return; const f = ON[el.dataset.on]; f && f(el, e); });
  document.addEventListener('change', e => { const el = e.target; if (!el.dataset || !el.dataset.on) return; if (!(el.tagName === 'SELECT' || ['checkbox', 'file', 'date', 'datetime-local', 'color'].includes(el.type))) return; const f = ON[el.dataset.on]; f && f(el, e); });
  document.addEventListener('keydown', e => { if (e.key === 'Enter') { const t = e.target; if (t.dataset && t.dataset.enter && ACT[t.dataset.enter]) { e.preventDefault(); return ACT[t.dataset.enter](t, e); } if (t.getAttribute && t.getAttribute('role') === 'button' && t.dataset.a && ACT[t.dataset.a]) { e.preventDefault(); return ACT[t.dataset.a](t, e); } } if (e.key === 'Escape') { if ($('.printview')) $('.printview').remove(); else if (MODAL) closeModal(); else document.body.classList.remove('nav-open', 'cart-open'); } });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener && matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderShell());
  const h = (location.hash || '').slice(1); if (MOD[h] && canView(h)) UI.route = h;
  render(); nativeInit(); tabGuardInit();
  if (!S.config.setupDone) setTimeout(() => EDITION === 'prod' ? openFirstRun() : openWizard(true), 300);
}
function migrate(noSave) {
  const c = S.config;
  if (!c.styleV2) { c.theme = 'dark'; c.styleV2 = true; }
  if (S.demo === undefined) S.demo = true;
  if (!S.debts) S.debts = []; if (!S.seq.debt) S.seq.debt = 1;
  c.accent = c.accent || '#FF7A1A'; c.tone = c.tone || 'calido'; c.addonLabel = c.addonLabel || 'Salsa'; c.addonPlural = c.addonPlural || 'Salsas';
  if (!c.migV4) { c.itemCats = { materia: 'Insumos', salsa: 'Preparaciones (salsas)', terminado: 'Productos terminados', empaque: 'Empaques', reventa: 'Reventa' }; S.products.forEach(p => { if (p.countLabel == null) p.countLabel = p.art === 'mini' ? 'minis' : p.art === 'combo' ? 'churros' : 'unidades'; }); S.users.forEach(u => { u.name = u.name.replace(/\s*\(Administrador\)/, ''); }); c.migV4 = true; }
  ['items', 'recipes', 'products', 'flavors', 'customers', 'suppliers', 'sales', 'orders', 'purchases', 'expenses', 'moves', 'inv', 'productions', 'cash', 'priceHistory', 'users'].forEach(k => { if (!Array.isArray(S[k])) S[k] = []; });
  if (typeof csEnsureExtra === 'function') csEnsureExtra();
  if (!c.migInvSales) { const nums = new Set(S.sales.map(s => s.num)); S.inv = S.inv.filter(m => !((m.type === 'venta' || m.type === 'anulacion') && nums.has(m.ref))); c.migInvSales = true; }
  if (!noSave) save();
}
boot();

</script>
<script>if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
