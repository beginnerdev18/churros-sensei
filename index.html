<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F0B09"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Churro Sensei">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-180.png">
<title>POS Manager</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>

<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Concepto: app gastronómica oscura y cálida (referencia del usuario): fondo carbón con resplandor naranja,
   tarjetas de vidrio ahumado, píldoras redondas, naranja en degradado solo para acciones y precios. */
:root{
  --bg:#0F0B09; --bg2:#15100D; --surface:rgba(40,31,26,.72); --surface-solid:#211915; --surface2:rgba(58,45,37,.55); --sunk:rgba(255,255,255,.05);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --fg:#F6EFE9; --muted:#B3A294; --faint:#7E6E62;
  --accent:#FF7A1A; --accent2:#FF9440; --accent-deep:#E2560B; --accent-ink:#FFFFFF; --accent-soft:rgba(255,122,26,.16);
  --grad:linear-gradient(135deg,#FF9A3D 0%,#FF7A1A 45%,#E2560B 100%);
  --brown:#4A2C1A; --nav:rgba(22,16,13,.86); --nav2:rgba(255,255,255,.06); --nav3:rgba(255,255,255,.1); --navfg:#F6EFE9; --navmuted:#A1907F;
  --ok:#3FCB7E; --ok-soft:rgba(63,203,126,.15); --bad:#FF5A4E; --bad-soft:rgba(255,90,78,.15); --warn:#FFC24A; --warn-soft:rgba(255,194,74,.14); --info:#6FB2FF; --info-soft:rgba(111,178,255,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35); --glow:0 8px 24px rgba(255,122,26,.35);
  --f-display:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:22px; --r-sm:14px; --deep:#16100D; --deep2:#2B1F18; color-scheme:dark;
}
:root[data-theme="dark"][data-tone="neutro"]{--bg:#0C0D0F;--surface:rgba(34,36,40,.74);--surface-solid:#1B1C20;--surface2:rgba(52,54,60,.55);--nav:rgba(18,19,22,.88);--muted:#A4A7AE;--faint:#6F737B;--deep:#121316;--deep2:#24262B}
:root[data-theme="dark"][data-tone="azul"]{--bg:#080C14;--surface:rgba(24,32,48,.74);--surface-solid:#141B29;--surface2:rgba(40,52,74,.55);--nav:rgba(12,17,28,.9);--muted:#9FAAC0;--faint:#68738A;--deep:#0D1320;--deep2:#1C2638}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F6F0EA; --bg2:#EFE6DD; --surface:rgba(255,255,255,.86); --surface-solid:#FFFFFF; --surface2:rgba(250,244,238,.9); --sunk:rgba(60,30,10,.05);
  --line:rgba(60,30,10,.09); --line2:rgba(60,30,10,.16); --fg:#24170F; --muted:#7A6555; --faint:#A8968A;
  --accent-soft:rgba(255,122,26,.12); --nav:rgba(26,18,14,.94); --nav2:rgba(255,255,255,.07); --nav3:rgba(255,255,255,.12);
  --ok:#1F8A4C; --ok-soft:#E1F3E8; --bad:#D23B30; --bad-soft:#FCE5E2; --warn:#A86E00; --warn-soft:#FBF0D3; --info:#2D6EAE; --info-soft:#E4EEF9;
  --shadow:0 8px 24px rgba(70,35,10,.08); color-scheme:light}}
:root[data-theme="light"]{
  --bg:#F6F0EA; --bg2:#EFE6DD; --surface:rgba(255,255,255,.86); --surface-solid:#FFFFFF; --surface2:rgba(250,244,238,.9); --sunk:rgba(60,30,10,.05);
  --line:rgba(60,30,10,.09); --line2:rgba(60,30,10,.16); --fg:#24170F; --muted:#7A6555; --faint:#A8968A;
  --accent-soft:rgba(255,122,26,.12); --nav:rgba(26,18,14,.94); --nav2:rgba(255,255,255,.07); --nav3:rgba(255,255,255,.12);
  --ok:#1F8A4C; --ok-soft:#E1F3E8; --bad:#D23B30; --bad-soft:#FCE5E2; --warn:#A86E00; --warn-soft:#FBF0D3; --info:#2D6EAE; --info-soft:#E4EEF9;
  --shadow:0 8px 24px rgba(70,35,10,.08); color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}@media (pointer:coarse){input.in,select.in,textarea.in,.search .in{font-size:16px}}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
.glow-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow-bg i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.38}
.glow-bg i:nth-child(1){width:520px;height:520px;background:var(--accent);top:-220px;right:-120px;opacity:.22}
.glow-bg i:nth-child(2){width:420px;height:420px;background:var(--accent-deep);bottom:-160px;left:10%;opacity:.3}
.glow-bg i:nth-child(3){width:300px;height:300px;background:#FFB15C;top:40%;right:20%;opacity:.08}
:root[data-theme="light"] .glow-bg i{opacity:.12}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.02em;font-weight:800}
h1{font-size:1.6rem} h2{font-size:1.2rem} h3{font-size:1rem;font-weight:700}
a{color:var(--accent2)}
.num,.tbl td.r,.money{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
*{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

/* ---------- estructura ---------- */
#app{display:flex;min-height:100%;position:relative;z-index:1}
.side{width:252px;flex:0 0 252px;background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-right:1px solid rgba(255,255,255,.06);color:var(--navfg);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;z-index:40;padding-left:env(safe-area-inset-left,0px)}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
.brand .logo{width:44px;height:44px;border-radius:14px;flex:none;overflow:hidden;box-shadow:var(--glow)}
.brand b{font-family:var(--f-display);font-size:1.1rem;font-weight:800;display:block;letter-spacing:-.02em}
.brand small{color:var(--navmuted);font-size:.74rem}
.navscroll{overflow-y:auto;flex:1;padding:4px 12px 12px}
.navgrp{display:flex;align-items:center;justify-content:space-between;width:100%;border:0;background:none;cursor:pointer;font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--navmuted);padding:14px 12px 6px;font-weight:800;border-radius:10px}
.navgrp:hover{color:var(--navfg)}
.navgrp .chev{width:14px;height:14px;transform:rotate(-90deg);transition:transform .15s}
.navgrp .chev.open{transform:rotate(90deg)}
.navi{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;color:var(--navfg);padding:9px 12px;border-radius:14px;cursor:pointer;text-align:left;font-size:.88rem;font-weight:500;opacity:.78;transition:background .15s,opacity .15s}
.navi:hover{background:var(--nav2);opacity:1}
.navi.on{background:var(--grad);color:#fff;opacity:1;font-weight:700;box-shadow:var(--glow)}
.navi svg{width:18px;height:18px;flex:none}
.navi .badge{margin-left:auto;background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;min-width:20px;text-align:center;padding:2px 6px;border-radius:99px}
.navi.on .badge{background:rgba(0,0,0,.25)}
.sidefoot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.06);font-size:.76rem;color:var(--navmuted)}
.sidefoot details summary{cursor:pointer;list-style:none;color:var(--navmuted);font-size:.74rem;margin-top:10px}
.sidefoot details summary::-webkit-details-marker{display:none}
.sidefoot select{width:100%;margin-top:6px;background:var(--nav2);border:1px solid var(--nav3);color:var(--navfg);border-radius:12px;padding:8px 10px}
.mainwrap{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.top .ttl{min-width:0;flex:1}
.top .ttl h1{font-size:1.22rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .crumb{font-size:.74rem;color:var(--muted);font-weight:600}
.top .menubtn{display:none}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.82rem;border:2px solid rgba(255,255,255,.15);cursor:pointer;flex:none}
.demo-flag{font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--warn-soft);color:var(--warn);padding:5px 10px;border-radius:99px;white-space:nowrap}
main#view{padding-block:22px 100px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));max-width:1400px;width:100%}
.bottomnav{display:none}
.drawer-bg{display:none}

/* ---------- componentes ---------- */
.card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card.pad{padding:18px 20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px 12px}
.card-h+.card-b,.card-h+.tblwrap{border-top:1px solid var(--line)}
.card-b{padding:16px 20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.split2{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
#cvgrid{grid-template-columns:minmax(0,1fr) auto}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.82rem} .tiny{font-size:.73rem}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
.b{font-weight:700} .r{text-align:right}
.mt{margin-top:14px} .mb{margin-bottom:14px} .grow{flex:1;min-width:0}
.acc{color:var(--accent)}
.sect-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sect-h h2{font-size:1.25rem}
.sect-h p{margin:5px 0 0;color:var(--muted);max-width:72ch;font-size:.88rem}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:-4px}
.sec-t h3{font-size:1.05rem;font-weight:800}
.sec-t .link{border:0;background:none;color:var(--accent2);font-weight:700;font-size:.82rem;cursor:pointer;padding:4px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--sunk);color:var(--fg);padding:9px 16px;border-radius:999px;cursor:pointer;font-weight:700;font-size:.85rem;white-space:nowrap;transition:background .15s,border-color .15s,transform .08s,box-shadow .15s}
.btn:hover{background:var(--surface2);border-color:var(--faint)}
.btn:active{transform:scale(.98)}
.btn svg{width:16px;height:16px}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dark{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#06210f}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{padding:6px 12px;font-size:.78rem}
.btn.lg{padding:14px 22px;font-size:.98rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.iconbtn{width:38px;height:38px;padding:0;border-radius:50%}
.plusbtn{width:32px;height:32px;border-radius:50%;border:0;background:var(--grad);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:var(--glow);flex:none}
.plusbtn svg{width:17px;height:17px}
label.f,div.f{display:flex;flex-direction:column;gap:6px;font-size:.78rem;font-weight:700;color:var(--muted);min-width:0}
.in,select.in,textarea.in{width:100%;background:var(--sunk);border:1px solid var(--line2);border-radius:14px;padding:10px 13px;color:var(--fg);font-size:.92rem;font-weight:500;min-width:0;transition:border-color .15s,box-shadow .15s}
select.in option{background:var(--surface-solid);color:var(--fg)}
.in::placeholder{color:var(--faint)}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{min-height:72px;resize:vertical}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:99px;background:var(--line2);position:relative;cursor:pointer;flex:none;transition:background .18s;margin:0;vertical-align:middle}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .18s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
input[type=checkbox]:checked{background:var(--grad)}
input[type=checkbox]:checked::after{transform:translateX(18px)}
input[type=checkbox]:disabled{opacity:.4;cursor:not-allowed}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.fgrid .span2{grid-column:1/-1}
.search{position:relative;flex:1;min-width:180px}
.search svg{position:absolute;z-index:2;pointer-events:none;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint)}
.search .in{padding-left:42px;border-radius:999px;padding-block:12px;background:var(--surface);backdrop-filter:blur(10px)}
.chips{display:flex;gap:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;max-width:100%}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap}
.row>.chips{min-width:0;flex:0 1 auto}
.row>.row{min-width:0;max-width:100%}
.sect-h>*{min-width:0;max-width:100%}
.chip{border:1px solid var(--line2);background:var(--sunk);padding:7px 14px;border-radius:99px;cursor:pointer;font-size:.8rem;font-weight:700;color:var(--muted);white-space:nowrap;flex:none;transition:all .15s}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:var(--glow)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.68rem;font-weight:800;padding:4px 10px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent2)}
.pill.solid{background:#E5332A;color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:.86rem}
.tbl th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:800;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td:nth-child(-n+2){white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer} .tbl tr.click:hover td{background:var(--sunk)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl tfoot td{font-weight:800;border-top:1px solid var(--line2);background:var(--sunk)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty svg{width:42px;height:42px;color:var(--faint);margin-bottom:10px}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:1.02rem;margin-bottom:4px}
.note{border-radius:16px;padding:12px 16px;font-size:.85rem;background:var(--info-soft);color:var(--fg);border:1px solid color-mix(in srgb,var(--info) 25%,transparent)}
.note.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.note.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.note.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:4px;background:var(--sunk);border:1px solid var(--line);border-radius:999px;width:max-content;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 16px;font-weight:700;color:var(--muted);cursor:pointer;border-radius:999px;white-space:nowrap;font-size:.84rem;transition:all .15s}
.tab:hover{color:var(--fg)}
.tab.on{color:#fff;background:var(--grad);box-shadow:var(--glow)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.88rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.sumline{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-variant-numeric:tabular-nums}
.sumline.tot{border-top:1px dashed var(--line2);margin-top:6px;padding-top:12px;font-weight:800;font-size:1.1rem}
.skel{background:linear-gradient(90deg,var(--sunk),var(--surface2),var(--sunk));background-size:200% 100%;animation:sk 1s linear infinite;border-radius:18px}
@keyframes sk{to{background-position:-200% 0}}
.price{font-family:var(--f-display);font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}

/* cobro y pedidos */
.paygrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.paytile{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:1.5px solid var(--line2);background:var(--sunk);color:var(--fg);cursor:pointer;text-align:left;transition:all .15s;min-height:62px}
.paytile svg{width:22px;height:22px;flex:none;color:var(--accent2)}
.paytile b{display:block;font-size:.92rem} .paytile small{display:block;color:var(--muted);font-size:.72rem;font-weight:600}
.paytile:hover{border-color:var(--accent)}
.paytile.on{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.paytile.on svg,.paytile.on small{color:#fff}
.link-btn{border:0;background:none;color:var(--accent2);font-weight:700;font-size:.82rem;cursor:pointer;padding:10px 0 0;text-align:left}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.ocol{background:var(--sunk);border:1px solid var(--line);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ocol-h{display:flex;align-items:center;gap:8px;padding:4px 6px}
.ocol-h svg{width:18px;height:18px;color:var(--accent2)} .ocol-h .pill{margin-left:auto}
.ocard{background:var(--surface-solid);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);min-width:0}
.olines{margin:0;padding:0;list-style:none;font-size:.86rem;display:flex;flex-direction:column;gap:3px}
.lastbar{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);flex-wrap:wrap}
.success-dot{width:34px;height:34px;border-radius:50%;background:var(--ok);color:#06210f;display:grid;place-items:center;flex:none}
.success-dot svg{width:18px;height:18px}
/* botón flotante */
.fab{position:fixed;right:max(24px,env(safe-area-inset-right,0px));bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fab .fab-main{width:60px;height:60px;border-radius:50%;border:0;background:var(--grad);color:#fff;box-shadow:var(--glow),0 10px 30px rgba(0,0,0,.4);cursor:pointer;display:grid;place-items:center;transition:transform .2s}
.fab .fab-main svg{width:26px;height:26px}
.fab.open .fab-main{transform:rotate(45deg)}
.fab .fab-opt{display:none;align-items:center;gap:10px;border:1px solid var(--line2);background:var(--surface-solid);color:var(--fg);padding:11px 18px 11px 14px;border-radius:999px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.fab .fab-opt svg{width:18px;height:18px;color:var(--accent2)}
.fab.open .fab-opt{display:inline-flex;animation:pu .15s}
.fab-bg{display:none}
body.fab-open .fab-bg{display:block;position:fixed;inset:0;z-index:44;background:rgba(0,0,0,.35)}
.amount-in{font-size:2rem!important;font-weight:800;text-align:center;padding:14px!important;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
.photo-drop{display:block;position:relative;border-radius:18px;overflow:hidden;aspect-ratio:1/0.86;background:#1E140F;cursor:pointer;border:1px solid var(--line)}
.photo-drop img,.photo-drop svg{width:100%;height:100%;object-fit:cover;display:block}
.photo-hint{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;font-size:.78rem;font-weight:700;backdrop-filter:blur(6px)}
.photo-hint svg{width:15px;height:15px}
.photo-drop:hover .photo-hint{background:var(--accent)}
/* deudas, reparto, checklist */
.dbar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}.dbar span{display:block;height:100%;background:var(--grad);border-radius:99px}
.splitbar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--sunk);gap:2px}.splitbar span{display:block;height:100%}
.rline{display:grid;grid-template-columns:14px minmax(0,1fr) auto 52px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.rline small{display:block;color:var(--muted);font-size:.74rem}.rline>b{font-variant-numeric:tabular-nums;text-align:right}.rline>.tiny{text-align:right}
.rline.tot{border-bottom:0;border-top:1px dashed var(--line2);margin-top:4px;padding-top:12px}.rline.tot>b{font-size:1.15rem}
.steps{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:10px;line-height:1.5}
.checklist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px;margin-top:12px}
.checklist button{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sunk);color:var(--fg);padding:9px 12px;border-radius:12px;cursor:pointer;font-size:.84rem;font-weight:600}
.checklist button svg{width:17px;height:17px;flex:none}.checklist .ok svg{color:var(--ok)}.checklist .miss{border-color:color-mix(in srgb,var(--warn) 45%,transparent)}.checklist .miss svg{color:var(--warn)}.checklist .opt{color:var(--muted)}
.ph-cam{position:absolute;right:8px;bottom:8px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.ph-cam svg{width:18px;height:18px}.ph-cam:hover{background:var(--accent)}
@media (max-width:520px){.rline{grid-template-columns:12px minmax(0,1fr) auto}.rline>.tiny{display:none}}
/* colores */
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid transparent;background:var(--sw);cursor:pointer;box-shadow:0 0 0 1px var(--line2);position:relative;flex:none}
.swatch.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--sw)}
.swatch.custom{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden}
.swatch.custom input{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
input[type=radio]{width:18px;height:18px;flex:none;margin:0}
@media (max-width:600px){#pfgrid,#cfgbrand{grid-template-columns:minmax(0,1fr)!important}}
/* inicio */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:stretch}
.hello .hi{color:var(--muted);font-weight:600;font-size:.95rem}
.display{font-size:clamp(2rem,4.2vw,3.1rem);line-height:1.02;font-weight:800;letter-spacing:-.035em;margin:6px 0 14px}
.display .acc{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.promo{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(120% 120% at 100% 0%,var(--accent-soft),transparent 55%),linear-gradient(160deg,var(--deep2),var(--deep));border:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:minmax(0,1fr) 42%;min-height:190px;box-shadow:var(--shadow);color:#F6EFE9}
.promo .pt{padding:20px 22px;display:flex;flex-direction:column;gap:6px;justify-content:center;z-index:1}
.promo .eyebrow svg{width:14px;height:14px}
.promo .eyebrow{font-size:.72rem;font-weight:700;color:#FFB070;display:flex;gap:6px;align-items:center}
.promo .big{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.05}
.promo .pa{position:relative}
.promo .pa svg,.promo .pa img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.promo .off{position:absolute;right:14px;top:14px;z-index:2;background:#fff;color:#1A120D;border-radius:14px;padding:6px 10px;font-weight:800;font-size:.78rem;text-align:center;line-height:1.1}
.tiles{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 6px}
.tiles::-webkit-scrollbar{display:none}
.tile{flex:none;width:86px;display:flex;flex-direction:column;align-items:center;gap:8px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:700;font-size:.74rem;text-align:center;padding:0}
.tile .tb{width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;transition:all .15s;backdrop-filter:blur(10px)}
.tile .tb svg{width:26px;height:26px;color:var(--fg)}
.tile:hover .tb{border-color:var(--accent)}
.tile.on{color:var(--fg)}
.tile.on .tb{background:var(--grad);border-color:transparent;box-shadow:var(--glow)}
.tile.on .tb svg{color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:12px}
.kpi{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:16px 18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s,transform .15s;min-width:0;color:var(--fg)}
.kpi:hover{border-color:color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-2px)}
.kpi .lb{font-size:.74rem;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.kpi .vl{font-family:var(--f-display);font-size:1.42rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .sub{font-size:.73rem;color:var(--faint)}
.kpi.hero{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.kpi.hero .lb,.kpi.hero .sub{color:rgba(255,255,255,.82)}
.kpi.alert .vl{color:var(--bad)} .kpi.good .vl{color:var(--ok)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.qa{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:.86rem;text-align:left;color:var(--fg)}
.qa:hover{border-color:var(--accent)}
.qa .ic{width:36px;height:36px;border-radius:12px;background:var(--accent-soft);color:var(--accent2);display:grid;place-items:center;flex:none}
.qa .ic svg{width:18px;height:18px}
.hscroll{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding:2px 2px 10px;scroll-snap-type:x mandatory}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none;width:200px}
.chart svg{display:block;width:100%;height:auto}
.chart text{fill:var(--faint);font-size:10px;font-family:var(--f-body)}
.chart .bar{fill:url(#barGrad);cursor:pointer;transition:opacity .12s} .chart .bar:hover{opacity:.8}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.6}
.chart .area{fill:var(--accent);opacity:.14}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:12px;align-items:center;font-size:.83rem;padding:6px 0;cursor:pointer}
.hbar .tr{height:9px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hbar .fl{height:100%;background:var(--grad);border-radius:99px}
.hbar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hbar:hover .nm{color:var(--accent2)}

/* tarjetas de producto */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:14px}
.pcard{position:relative;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;overflow:hidden;cursor:pointer;text-align:left;padding:8px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s;color:var(--fg)}
.pcard:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);transform:translateY(-3px)}
.pcard .ph{aspect-ratio:1/0.86;background:#1E140F;position:relative;max-width:100%;border-radius:16px;overflow:hidden}
.pcard .ph img,.pcard .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.pcard .ph .pill{position:absolute;top:8px;left:8px}
.pcard .bd{padding:10px 6px 4px;display:flex;flex-direction:column;gap:2px;flex:1}
.pcard .nm{font-weight:800;font-size:.9rem;line-height:1.25}
.pcard .sb2{font-size:.74rem;color:var(--muted)}
.pcard .ft{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:8px}
.pcard .pr{font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:1.02rem}
.pcard.off{opacity:.5}
.cart{background:var(--nav);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--navfg);border-radius:26px;border:1px solid rgba(255,255,255,.08);position:sticky;top:84px;display:flex;flex-direction:column;max-height:calc(100dvh - 104px);overflow:hidden;box-shadow:var(--shadow)}
.cart .ch{padding:18px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.cart .ch h2{color:#fff}
.cart .cl{overflow-y:auto;padding:0 14px;flex:1;min-height:80px}
.cline{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.06);border-radius:18px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:4px 8px}
.cline .n{font-weight:800;color:#fff}
.cline .d{font-size:.75rem;color:var(--navmuted)}
.cline .t{font-weight:800;color:var(--accent2);text-align:right;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;padding:2px}
.qty button{border:0;background:none;color:inherit;width:30px;height:30px;cursor:pointer;font-size:1.05rem;border-radius:50%;font-weight:700}
.qty button:hover{background:rgba(255,255,255,.1)}
.qty span{min-width:26px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.qty.big button{width:40px;height:40px}
.cart .cf{padding:14px 20px 20px;border-top:1px solid rgba(255,255,255,.07)}
.cart .sumline{color:var(--navmuted);padding:3px 0}
.cart .sumline.tot{color:#fff;border-color:rgba(255,255,255,.12)}
.cart .in,.cart select.in{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:var(--navfg)}
.cart .btn:not(.pri){background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:var(--navfg)}
.cart label.f{color:var(--navmuted)}
.cart .empty{color:var(--navmuted)} .cart .empty b{color:#fff}
.cartfab{display:none}
.cartfab svg{width:20px;height:20px;vertical-align:-4px}
.flv{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.flv::-webkit-scrollbar{display:none}
.flv button{flex:none;display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--sunk);padding:8px 14px 8px 10px;border-radius:99px;cursor:pointer;font-weight:700;font-size:.82rem;text-align:left;color:var(--fg)}
.flv button.on{border-color:transparent;background:var(--grad);color:#fff;box-shadow:var(--glow)}
.flv button.on .tiny{color:rgba(255,255,255,.85)!important}
.flv button[disabled]{opacity:.4;cursor:not-allowed}
.optrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.optrow:last-child{border-bottom:0}
.optrow .ol{display:flex;align-items:center;gap:10px;font-weight:600}
.detail-hero{position:relative;margin:-18px -20px 16px;aspect-ratio:16/9;max-height:250px;width:calc(100% + 40px);overflow:hidden;background:#1E140F}
.detail-hero svg,.detail-hero img{width:100%;height:100%;object-fit:cover;display:block}
.detail-hero::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,var(--surface-solid))}
.metarow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0 6px}
.paybox{display:grid;grid-template-columns:1fr 130px auto;gap:8px;align-items:center;margin-bottom:8px}

/* modal + toast */
.mbg{position:fixed;inset:0;background:rgba(5,3,2,.66);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .15s}
@keyframes fi{from{opacity:0}}
.modal{background:var(--surface-solid);border:1px solid var(--line);border-radius:26px;width:min(560px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.55);animation:pu .18s;overflow:hidden}
.modal.wide{width:min(820px,100%)} .modal.xwide{width:min(1100px,100%)}
@keyframes pu{from{transform:translateY(12px);opacity:.5}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.modal .mb{padding:18px 20px;overflow-y:auto}
.modal .mf{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--sunk)}
.merr{margin-bottom:12px}
#toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--deep2);color:#F6EFE9;padding:12px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 32px rgba(0,0,0,.45);font-size:.86rem;display:flex;gap:10px;align-items:flex-start;animation:pu .15s}
.toast svg{color:var(--ok)} .toast.bad svg{color:var(--bad)} .toast.info svg{color:var(--accent)}

/* recibo */
.receipt{background:#fff;color:#111;font-family:'Courier New',ui-monospace,monospace;font-size:12px;width:min(300px,100%);margin:0 auto;padding:16px 14px;box-shadow:0 2px 12px rgba(0,0,0,.25);border-radius:6px}
.receipt .c{text-align:center} .receipt hr{border:0;border-top:1px dashed #999;margin:8px 0}
.receipt .ln{display:flex;justify-content:space-between;gap:8px}
.invoice{background:#fff;color:#1a1a1a;font-family:var(--f-body);padding:28px;border-radius:10px;box-shadow:0 2px 12px rgba(0,0,0,.2);max-width:720px;margin:0 auto;font-size:13px}
.invoice table{width:100%;border-collapse:collapse} .invoice th,.invoice td{padding:7px 6px;border-bottom:1px solid #e6e6e6;text-align:left} .invoice .r{text-align:right}
.printview{position:fixed;inset:0;background:#e9e5e1;color:#222;z-index:95;overflow:auto;padding:20px max(16px,env(safe-area-inset-left,0px))}
.success-ic{width:76px;height:76px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;margin:0 auto 12px;box-shadow:var(--glow)}
.success-ic svg{width:38px;height:38px}

/* recetas */
.rx{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px;align-items:start}
.rx .costpanel{position:sticky;top:84px;background:var(--nav);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.08);color:var(--navfg);border-radius:26px;padding:20px;box-shadow:var(--shadow)}
.costpanel .big{font-family:var(--f-display);font-size:2.1rem;font-weight:800;font-variant-numeric:tabular-nums;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.03em}
.costpanel .sumline{color:var(--navmuted)} .costpanel .sumline b{color:#fff}
.costpanel .in{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:var(--navfg)}
.costpanel label.f{color:var(--navmuted)}
.costpanel .btn:not(.pri){background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);color:var(--navfg)}
.ingtbl td .in{padding:8px 10px;border-radius:12px}
.ingtbl select.in{min-width:74px;padding-right:4px}
.ingcards{display:none}
.combo{position:relative}
.combo .list{position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--surface-solid);border:1px solid var(--line2);border-radius:18px;box-shadow:var(--shadow);z-index:20;max-height:270px;overflow-y:auto;padding:6px}
.combo .list button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;background:none;padding:10px 12px;cursor:pointer;text-align:left;font-size:.86rem;border-radius:12px;color:var(--fg)}
.combo .list button:hover,.combo .list button:focus{background:var(--accent-soft)}
.combo .list button[disabled]{opacity:.45;cursor:not-allowed}

/* catálogo virtual (vista del cliente) */
.phone{width:min(380px,100%);margin:0 auto;background:#050302;border-radius:44px;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.08)}
.phone .scr{position:relative;background:radial-gradient(120% 60% at 80% 0%,var(--accent-soft),transparent 60%),#120D0A;color:#F6EFE9;border-radius:36px;overflow:hidden;height:min(740px,calc(100dvh - 140px));display:flex;flex-direction:column}
.phone .cv-body{overflow-y:auto;flex:1;padding:16px 16px 20px;scrollbar-width:none}
.phone .cv-body::-webkit-scrollbar{display:none}
.phone .sbar{display:flex;justify-content:space-between;padding:12px 26px 0;font-size:.72rem;font-weight:700}
.phone .cv-foot{padding:12px 16px 18px;background:rgba(18,13,10,.9);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.07)}
.phone .tile .tb{width:56px;height:56px;border-radius:18px;background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}
.phone .tile{width:62px;color:#B3A294} .phone .tile.on{color:#fff}
.phone .tile .tb svg{color:#F6EFE9}
.phone .pcard{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.08);color:#F6EFE9}
.phone .pcard .sb2{color:#B3A294}
.phone .search .in{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1);color:#F6EFE9}
.phone .promo{min-height:150px}
.phone .promo .big{font-size:1.4rem}
.phone .optrow{border-color:rgba(255,255,255,.08)}
.cvnav{display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px 16px;background:rgba(14,10,8,.95);border-top:1px solid rgba(255,255,255,.07)}
.cvnav span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.62rem;color:#7E6E62;font-weight:700}
.cvnav span svg{width:20px;height:20px}
.cvnav span.on{color:var(--accent)}

/* pruebas */

<script>
const EDITION = 'prod';

/* ================= CHURRO SENSEI MANAGER — MOTOR DE DATOS (DEMO) ================= */
'use strict';
const TZ = 'America/Managua';
const DAY = 864e5;
const _fmtDay = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
const _fmtHM = new Intl.DateTimeFormat('es-NI', { timeZone: TZ, hour: '2-digit', minute: '2-digit', hour12: true });
const dayKey = ts => _fmtDay.format(new Date(ts));
const monthKey = ts => dayKey(ts).slice(0, 7);
// Nicaragua: UTC-6 fijo, sin horario de verano
const tsLocal = (dk, h = 0, m = 0) => Date.UTC(+dk.slice(0, 4), +dk.slice(5, 7) - 1, +dk.slice(8, 10), h + 6, m);
const addDays = (dk, n) => dayKey(tsLocal(dk, 12) + n * DAY);
const r2 = n => Math.round((n + (n >= 0 ? 1 : -1) * 1e-9) * 100) / 100;
let _uidN = 0;
const uid = p => p + (++_uidN).toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));

const UNITS = { g: ['g', 1], kg: ['g', 1000], lb: ['g', 453.592], oz: ['g', 28.3495], ml: ['ml', 1], l: ['ml', 1000], gal: ['ml', 3785.41], u: ['u', 1], doc: ['u', 12] };
const UNIT_LABEL = { g: 'g', kg: 'kg', lb: 'lb', oz: 'oz', ml: 'ml', l: 'L', gal: 'galón', u: 'u', doc: 'docena' };
function conv(qty, unit, it) {
  const d = UNITS[unit]; if (!d || !it) return NaN;
  const q = (+qty) * d[1];
  if (d[0] === it.unit) return q;
  const den = +it.density;
  if (den > 0) {
    if (d[0] === 'ml' && it.unit === 'g') return q * den;
    if (d[0] === 'g' && it.unit === 'ml') return q / den;
  }
  return NaN;
}
function unitsFor(it) {
  const b = { g: ['g', 'kg', 'lb', 'oz'], ml: ['ml', 'l', 'gal'], u: ['u', 'doc'] }[it.unit] || ['u'];
  if (+it.density > 0) { if (it.unit === 'g') return b.concat(['ml', 'l', 'gal']); if (it.unit === 'ml') return b.concat(['g', 'kg', 'lb', 'oz']); }
  return b;
}

let S = null;
const ERR = msg => { const e = new Error(msg); e.user = true; return e; };

/* ---------- lookups ---------- */
const byId = (arr, id) => arr.find(x => x.id === id);
const item = id => byId(S.items, id);
const recipe = id => byId(S.recipes, id);
const prod = id => byId(S.products, id);
const flavor = id => byId(S.flavors, id);
const customer = id => byId(S.customers, id);
const supplier = id => byId(S.suppliers, id);
const methodName = id => (S.config.payMethods.find(p => p.id === id) || { name: id }).name;
const accountOf = id => (S.config.payMethods.find(p => p.id === id) || { account: 'banco' }).account;

/* ---------- estados: conteo inicial, costo pendiente, recetas aprobadas ---------- */
const tracked = it => !!it && it.tracks !== false;              // false = no se controla existencia (p. ej. agua)
const needsCount = it => tracked(it) && it.stockInit === false; // existencia desconocida: NULL ≠ 0
const costPending = it => !!it && it.costStatus === 'pendiente'; // costo desconocido: nunca se toma como C$0 "real"
const RECIPE_OK = 'APROBADA';
const recipeApproved = r => !!r && (!r.status || r.status === RECIPE_OK);
function recipeStatusInfo(r) {
  const s = (r && r.status) || RECIPE_OK;
  if (s === RECIPE_OK) return { cls: 'ok', label: 'Aprobada', code: s };
  if (/HISTORICA/.test(s)) return { cls: '', label: 'Histórica', code: s };
  if (/REFERENCIA/.test(s)) return { cls: 'info', label: 'Referencia', code: s };
  if (/BORRADOR/.test(s)) return { cls: 'warn', label: 'Borrador', code: s };
  return { cls: 'warn', label: 'Provisional', code: s };
}
const curUserRole = () => ((S.users || []).find(u => u.id === S.userId) || {}).role;
function audit(kind, msg, data) { (S.audit = S.audit || []).push(Object.assign({ id: uid('au'), ts: Date.now(), by: S.userId, kind, msg }, data || {})); }

/* ---------- dinero ---------- */
function openSession() { return S.cash.find(c => !c.closedAt) || null; }
function addMove(account, method, amount, type, ref, ts, note, extra) {
  const s = openSession();
  const m = Object.assign({ id: uid('mv'), ts, account, method, amount: r2(amount), type, ref: ref || '', note: note || '', sessionId: s ? s.id : null }, extra || {});
  S.moves.push(m); return m;
}
function accountBal(acc, upto) {
  let b = S.opening[acc] || 0;
  for (const m of S.moves) if (m.account === acc && (upto == null || m.ts < upto)) b += m.amount;
  return r2(b);
}

/* ---------- inventario ---------- */
function invMove(itemId, qty, unitCost, type, ref, ts, note, noLog) {
  const it = item(itemId); if (!it) throw ERR('Artículo no encontrado');
  let uc;
  if (qty >= 0) {
    uc = +unitCost || 0;
    const nv = it.stock * it.cost + qty * uc;
    it.stock += qty;
    if (it.stock > 1e-9) it.cost = nv / it.stock;
    else { const fix = it.stock * uc - nv; it.cost = uc; if (Math.abs(fix) > 1e-9) S.inv.push({ id: uid('im'), ts, itemId, type: 'revalorizacion', qty: 0, unitCost: uc, value: fix, ref: ref || '', note: 'Ajuste por existencia negativa' }); }
  } else {
    uc = it.cost; it.stock += qty;
    if (Math.abs(it.stock) < 1e-7) it.stock = 0;
  }
  const m = { id: uid('im'), ts, itemId, type, qty, unitCost: uc, value: qty * uc, ref: ref || '', note: note || '' };
  if (!noLog) S.inv.push(m); return m;
}
// los movimientos de venta y anulación no se duplican en S.inv: se derivan de cada venta (s.cons). Ahorra la mitad del espacio.
function saleInvMoves(from, to) {
  from = from == null ? -Infinity : from; to = to == null ? Infinity : to; const out = [];
  for (const s of S.sales) {
    if (s.ts >= from && s.ts < to) for (const c of s.cons || []) out.push({ id: s.id + ':' + c.itemId, ts: s.ts, itemId: c.itemId, type: 'venta', qty: -c.qty, unitCost: c.unitCost, value: -c.qty * c.unitCost, ref: s.num, note: '', derived: true });
    if (s.status === 'anulada' && s.voidTs >= from && s.voidTs < to) for (const c of s.cons || []) out.push({ id: s.id + ':a:' + c.itemId, ts: s.voidTs, itemId: c.itemId, type: 'anulacion', qty: c.qty, unitCost: c.unitCost, value: c.qty * c.unitCost, ref: s.num, note: 'Devolución por anulación', derived: true });
  }
  return out;
}
function allInvMoves(from, to) { return (from == null ? S.inv : S.inv.filter(m => m.ts >= from && m.ts < to)).concat(saleInvMoves(from, to));
}
// retirar a un costo específico (devoluciones a proveedor)
function invRemoveAt(itemId, qty, lc, type, ref, ts, note) {
  const it = item(itemId);
  const nv = it.stock * it.cost - qty * lc;
  it.stock -= qty;
  let leftover = 0;
  if (it.stock > 1e-7 && nv >= 0) it.cost = nv / it.stock;
  else { leftover = it.stock > 1e-7 ? nv - it.stock * it.cost : nv; if (it.stock <= 1e-7) it.stock = 0; }
  S.inv.push({ id: uid('im'), ts, itemId, type, qty: -qty, unitCost: lc, value: -qty * lc, ref, note });
  if (Math.abs(leftover) > 1e-9) S.inv.push({ id: uid('im'), ts, itemId, type: 'revalorizacion', qty: 0, unitCost: it.cost, value: -leftover, ref, note: 'Ajuste de valor por devolución' });
}
const ADJ_TYPES = ['ajuste', 'merma', 'conteo', 'entrada', 'salida', 'revalorizacion'];
function aggregate(cons) { const a = {}; for (const c of cons) a[c.itemId] = (a[c.itemId] || 0) + c.qty; return a; }
function shortages(cons) {
  const a = aggregate(cons); const out = [];
  for (const id in a) { const it = item(id); if (!tracked(it) || needsCount(it)) continue; if (it.stock + 1e-6 < a[id]) out.push({ it, need: a[id], have: it.stock }); }
  return out;
}
// revisión previa a la venta: artículos sin conteo inicial, recetas sin aprobar y costos pendientes
function reviewCons(cons) {
  const unc = [], unap = [], pc = [], seen = new Set();
  for (const c of cons) {
    const it = item(c.itemId);
    if (needsCount(it) && !seen.has('i' + it.id)) { seen.add('i' + it.id); unc.push(it); }
    if (costPending(it) && !seen.has('c' + it.id)) { seen.add('c' + it.id); pc.push(it); }
    if (c.rid && !seen.has('r' + c.rid)) { seen.add('r' + c.rid); const r = recipe(c.rid); if (r && !recipeApproved(r)) unap.push(r); }
  }
  return { uncounted: unc, unapproved: unap, pendingCost: pc, blocking: unc.length + unap.length > 0 };
}
function reviewMsg(rv) {
  const p = [];
  if (rv.uncounted.length) p.push('Falta el conteo inicial de: ' + rv.uncounted.map(i => i.name).join(', ') + '.');
  if (rv.unapproved.length) p.push('Receta sin aprobar: ' + rv.unapproved.map(r => r.name).join(', ') + '.');
  return p.join(' ');
}
function fmtQty(q, unit) {
  if (unit === 'u') return (Math.round(q * 100) / 100).toLocaleString('es-NI') + ' u';
  if (Math.abs(q) >= 1000) return (Math.round(q / 10) / 100).toLocaleString('es-NI') + (unit === 'g' ? ' kg' : ' L');
  return (Math.round(q * 10) / 10).toLocaleString('es-NI') + ' ' + unit;
}
function shortageMsg(sh) { return 'Stock insuficiente: ' + sh.map(s => `${s.it.name} (faltan ${fmtQty(s.need - s.have, s.it.unit)})`).join(', ') + '.'; }
function setItemCost(itemId, newCost, ts, note, source) {
  const it = item(itemId); const old = it.cost; const delta = it.stock * (newCost - old);
  const first = costPending(it); // primer costo conocido: el valor de lo ya contado entra al capital inicial, no al resultado
  it.cost = +newCost;
  if (first || it.costStatus === 'inferido') it.costStatus = 'ok';
  S.inv.push({ id: uid('im'), ts, itemId, type: first ? 'costo_inicial' : 'revalorizacion', qty: 0, unitCost: newCost, value: delta, ref: first ? 'Primer costo' : 'Cambio de costo', note: note || `Costo ${old.toFixed(4)} → ${(+newCost).toFixed(4)} por ${it.unit}` });
  if (first) S.opening.inv = (S.opening.inv || 0) + delta;
  S.priceHistory.push({ ts, itemId, unitCost: +newCost, source: source || 'Edición manual' });
}
function adjustInventory(itemId, type, qty, ts, note, unitCost) {
  const it = item(itemId); if (!it) throw ERR('Selecciona un artículo');
  qty = +qty; if (!(qty >= 0) && type !== 'ajuste') throw ERR('La cantidad debe ser un número positivo');
  if (type === 'conteo' && !tracked(it)) throw ERR(`${it.name} no lleva control de existencias`);
  if (type === 'conteo' && needsCount(it)) { // primer conteo físico: crea el movimiento COUNT_INITIAL auditable
    if (!(qty >= 0)) throw ERR('La cantidad contada no puede ser negativa');
    const m = invMove(itemId, qty - it.stock, it.cost, 'conteo_inicial', 'Conteo inicial', ts, note || `Conteo inicial: ${fmtQty(qty, it.unit)}`);
    S.opening.inv = (S.opening.inv || 0) + m.value; // existencia que ya tenías: es capital inicial, no ganancia
    it.stockInit = true; it.countedAt = ts; it.countedBy = S.userId;
    m.counted = qty; m.by = S.userId;
    return m;
  }
  if (type === 'conteo') {
    const diff = qty - it.stock; if (Math.abs(diff) < 1e-9) return null;
    return invMove(itemId, diff, it.cost, 'conteo', 'Conteo físico', ts, note || `Contado: ${fmtQty(qty, it.unit)}`);
  }
  if (type === 'entrada') return invMove(itemId, qty, unitCost != null && unitCost !== '' ? +unitCost : it.cost, 'entrada', 'Entrada manual', ts, note);
  if (type === 'salida' || type === 'merma') {
    if (qty > it.stock + 1e-9) throw ERR(`Solo hay ${fmtQty(it.stock, it.unit)} de ${it.name}`);
    return invMove(itemId, -qty, 0, type, type === 'merma' ? 'Merma' : 'Salida manual', ts, note);
  }
  if (type === 'ajuste') {
    if (it.stock + qty < -1e-9) throw ERR('El ajuste dejaría existencias negativas');
    return invMove(itemId, qty, it.cost, 'ajuste', 'Ajuste', ts, note);
  }
  throw ERR('Tipo de movimiento no válido');
}

/* ---------- costos ---------- */
function itemEstCost(it, depth = 0) {
  if (!it) return 0;
  if (it.cost > 0 || depth > 4) return it.cost;
  const r = S.recipes.find(x => x.outputItemId === it.id);
  if (r) { const rc = recipeCost(r, {}, depth + 1); return rc.unitWaste || 0; }
  return 0;
}
// cuántas "recetas completas" de la subreceta usa una línea (porción = 1 receta; o en la unidad de su rendimiento)
function subFactor(l, sub) {
  const y = +sub.yieldQty || 0; if (!(y > 0) || !(+l.qty >= 0)) return NaN;
  if (l.unit === 'porcion') return +l.qty;
  if (l.unit === sub.yieldUnit) return +l.qty / y;
  const a = UNITS[l.unit], b = UNITS[sub.yieldUnit];
  if (a && b && a[0] === b[0]) return (+l.qty * a[1]) / (y * b[1]);
  return NaN;
}
// expande la receta (y sus subrecetas, recursivamente) UNA sola vez hasta artículos de inventario
function expandRecipe(r, factor, out, stack) {
  stack = stack || [];
  if (!r) throw ERR('Receta no encontrada');
  if (stack.includes(r.id)) throw ERR('Ciclo de subrecetas: ' + stack.concat(r.id).map(id => (recipe(id) || { name: id }).name).join(' → '));
  const st = stack.concat(r.id);
  for (const l of r.lines || []) {
    if (l.recipeId) {
      const sub = recipe(l.recipeId); if (!sub) throw ERR(`“${r.name}” usa una subreceta que no existe`);
      const f = subFactor(l, sub); if (isNaN(f)) throw ERR(`Unidad incompatible entre “${r.name}” y su subreceta “${sub.name}”`);
      expandRecipe(sub, factor * f, out, st);
    } else {
      const it = item(l.itemId); if (!it) throw ERR(`“${r.name}” usa un artículo que no existe`);
      const q = conv(l.qty, l.unit, it); if (isNaN(q)) throw ERR(`Unidad incompatible en “${r.name}”: ${it.name} (${UNIT_LABEL[l.unit] || l.unit} → ${it.unit})`);
      out.push({ itemId: it.id, qty: q * factor, rid: r.id });
    }
  }
  return out;
}
function recipeCost(r, overrides = {}, depth = 0, stack) {
  stack = stack || [];
  let total = 0, bad = 0, cycle = false; const pending = new Set(), inferred = new Set();
  if (r.id && stack.includes(r.id)) return { lines: [], total: 0, bad: 1, unit: 0, unitWaste: 0, pending: [], inferred: [], cycle: true, incomplete: false };
  const st = r.id ? stack.concat(r.id) : stack;
  const lines = (r.lines || []).map(l => {
    if (l.recipeId) {
      const sub = recipe(l.recipeId);
      if (!sub) { bad++; return { l, sub: null, factor: NaN, unitCost: 0, cost: NaN, missing: true }; }
      const f = subFactor(l, sub); const sc = recipeCost(sub, overrides, depth + 1, st);
      if (sc.cycle) cycle = true; sc.pending.forEach(x => pending.add(x)); sc.inferred.forEach(x => inferred.add(x));
      const cost = isNaN(f) || sc.bad ? NaN : sc.total * f;
      if (isNaN(cost)) bad++; else total += cost;
      return { l, sub, factor: f, unitCost: sc.total, cost, subCost: sc };
    }
    const it = item(l.itemId);
    const q = conv(l.qty, l.unit, it);
    const uc = overrides[l.itemId] != null ? overrides[l.itemId] : itemEstCost(it, depth);
    if (it && costPending(it) && overrides[l.itemId] == null) pending.add(it.id);
    if (it && it.costStatus === 'inferido') inferred.add(it.id);
    const cost = isNaN(q) ? NaN : q * uc;
    if (isNaN(cost)) bad++; else total += cost;
    return { l, it, baseQty: q, unitCost: uc, cost, pending: !!(it && costPending(it)) };
  });
  const y = +r.yieldQty || 0;
  const eff = y * (1 - (+r.waste || 0) / 100);
  return { lines, total, bad, unit: y > 0 ? total / y : 0, unitWaste: eff > 0 ? total / eff : 0, pending: [...pending], inferred: [...inferred], cycle, incomplete: pending.size > 0 };
}

        lines.push({ recipeId: c.ref, qty: c.qty, unit: /^porci/.test(c.unit) ? 'porcion' : (CS_UNIT[c.unit] || c.unit), status: c.status, note: c.note });

        lines.push({ itemId: c.ref, qty: c.qty, unit: u || c.unit, status: c.status, note: c.note });
      }
    }
    // una porción de salsa rinde la suma de sus gramos (38 g; la histórica de Nutella 32.57 g)
    const grams = lines.reduce((a, l) => a + (l.itemId && l.unit === 'g' ? l.qty : 0), 0);
    const y = porcion ? Math.round(grams * 100) / 100 : m.yieldQty;

  });
  // base común de los minis: igual a R-MINI-<SABOR>-14 sin la subreceta de salsa (la salsa se elige al vender)
  const minis = out.filter(r => /^R-MINI-.*-14$/.test(r.id));
  const sig = r => JSON.stringify(r.lines.filter(l => l.itemId).map(l => [l.itemId, l.qty, l.unit]));

    if (minis.some(r => sig(r) !== sig(minis[0]))) warns.push('Las recetas R-MINI-*-14 no tienen exactamente la misma base; se usó la de ' + minis[0].id + '.');
    if (minis.some(r => r.lines.filter(l => l.recipeId).length !== 1)) errs.push('Cada R-MINI-*-14 debe tener una sola subreceta de salsa.');
    out.push({ id: 'R-MINI-BASE-14', extId: 'R-MINI-BASE-14', name: 'Mini churros — base de 14 (salsa a elegir)', kind: 'producto', status: 'PROVISIONAL_BASE_COMUN_MINIS', active: true, yieldQty: 1, yieldUnit: 'u', yieldLabel: 'orden de 14 mini churros',
      waste: 0, notes: 'Base común de las recetas R-MINI-<SABOR>-14 (107 g harina, 4.75 g sal, 3.56 g azúcar, 20 ml aceite, inserto, vaso con domo, bolsa kraft, sticker y 3 servilletas) SIN la subreceta de salsa: al vender se elige 1 salsa de 38 g, que ya incluye su vaso de 2 oz y tapa. Resultado idéntico a R-MINI-<SABOR>-14, sin duplicar vaso ni tapa.',
      source: 'Derivada de ' + minis.map(r => r.id).join(', '), option: { ref: 'SALSA_38G_SELECCIONADA', label: 'Salsa de 38 g elegida al vender', portions: 1 }, lines: minis[0].lines.filter(l => l.itemId).map(l => Object.assign({}, l)), productId: null, outputItemId: null, version: 1, src: 'Derivada' });
  }

  const map = {}; out.forEach(r => map[r.id] = r);

  out.forEach(r => visit(r.id, []));
  return { recipes: out, errs: [...new Set(errs)], warns };
}

function csImport(D, opt) {
  opt = opt || {}; D = csData(D);
  if (!opt.dry) { const pre = csImport(D, Object.assign({}, opt, { dry: true })); if (pre.errors.length) { const e = ERR('No se importó nada: ' + pre.errors.join(' · ')); e.report = pre; throw e; } }
  const real = S; if (opt.dry) S = clone(S);
  const rep = { mode: opt.replace ? 'replace' : 'merge', items: { nuevos: [], existentes: [], vinculados: [] }, recipes: { nuevos: [], existentes: [] }, products: { nuevos: [], existentes: [], vinculados: [] }, flavors: { nuevos: [], existentes: [], vinculados: [] }, warnings: [], errors: [], pendingCount: 0, pendingCost: [], inferred: [], unapproved: 0 };
  try {
    const B = csBuildRecipes(D); rep.errors.push(...B.errs); rep.warnings.push(...B.warns);
    if (opt.replace) {
      const keep = clone(S.config); const owner = clone((S.users || []).find(u => u.id === S.userId) || { name: 'Administrador' });
      S = baseState(); S.demo = false; Object.assign(S.config, keep, { setupDone: true, allowNegative: false });
      S.users = [Object.assign(owner, { id: 'u1', role: 'admin' })]; S.userId = 'u1';
      S.customers = [{ id: 'c0', name: 'Cliente de mostrador', phone: '', notes: '', creditLimit: 0, createdAt: Date.now() }];
    }
    S.audit = S.audit || [];
    const idMap = {};
    // ---- artículos (Inventario_Manual). Nunca se importa existencia: queda pendiente de conteo ----
    for (const d of D.items) {
      let it = item(d.id) || S.items.find(i => i.extId === d.id);
      if (it) { idMap[d.id] = it.id; rep.items.existentes.push(d.name); continue; }
      const byName = S.items.find(i => !i.extId && csNorm(i.name) === csNorm(d.name));
      if (byName) {
        byName.extId = d.id; idMap[d.id] = byName.id; rep.items.vinculados.push(d.name);
        if (byName.unit !== d.unit) rep.warnings.push(`Tu artículo “${byName.name}” se mide en ${byName.unit} y en el Excel en ${d.unit}: revisa sus recetas.`);
        continue;
      }
      S.items.push({ id: d.id, extId: d.id, name: d.name, cat: d.cat, unit: d.unit, cost: d.cost == null ? 0 : d.cost,
        costStatus: d.cost == null ? 'pendiente' : d.costStatus === 'inferido' ? 'inferido' : d.costStatus === 'historico' ? 'historico' : 'ok', costLabel: d.costLabel,
        stock: 0, stockInit: d.tracks ? false : true, tracks: d.tracks, min: 0, density: 0, active: d.active, notes: d.notes, src: 'Inventario_Manual' });
      idMap[d.id] = d.id; rep.items.nuevos.push(d.name);
    }
    // ---- recetas (Recetas_Master + Recetas_Componentes) ----
    for (const r0 of B.recipes) {
      const ex = recipe(r0.id) || S.recipes.find(r => r.extId === r0.id);
      if (ex) { rep.recipes.existentes.push(r0.name); continue; }
      const r = clone(r0); r.lines.forEach(l => { if (l.itemId) l.itemId = idMap[l.itemId] || l.itemId; }); r.updatedAt = Date.now();
      S.recipes.push(r); rep.recipes.nuevos.push(r.name);
    }
    // ---- sabores: cada sabor elegido = 1 porción de su subreceta de 38 g (incluye vaso 2 oz + tapa) ----
    for (const [id, name, rid, color, active] of CS_FLAVORS) {
      if (flavor(id) || S.flavors.find(f => f.extId === id)) { rep.flavors.existentes.push(name); continue; }
      const byName = S.flavors.find(f => !f.extId && csNorm(f.name) === csNorm(name));
      if (byName) { byName.extId = id; rep.flavors.vinculados.push(name + ' (se conserva como lo tenías)'); continue; }
      S.flavors.push({ id, extId: id, name, color, active, mode: 'porcion', itemId: '', recipeId: rid || '', src: 'Recetas_Master' });
      rep.flavors.nuevos.push(name + (active ? '' : ' (inactivo)'));
    }
    // ---- productos ----
    const refOf = n => (D.refCosts || []).find(x => csNorm(x.product).startsWith(csNorm(n)));
    for (const P of CS_PRODUCTS) {
      const r = recipe(P.recipe); const ref = refOf(P.ref) || {};
      const sauces = P.sauces != null ? P.sauces : r && r.option ? r.option.portions : 0;
      const ex = prod(P.id) || S.products.find(p => p.extId === P.id);
      if (ex) { rep.products.existentes.push(P.name); continue; }
      const byName = S.products.find(p => !p.extId && csNorm(p.name) === csNorm(P.name));
      if (byName) {
        byName.extId = P.id; Object.assign(byName, { refCost: ref.cost != null ? +ref.cost : null, refStatus: ref.status || '', refNote: ref.rule || '' });
        if (!byName.recipeId && r) { byName.recipeId = r.id; r.productId = byName.id; rep.products.vinculados.push(P.name + ' (se le asignó la receta importada)'); }
        else rep.products.vinculados.push(P.name + ' (conserva su receta actual; la importada queda disponible)');
        continue;
      }
      const price = ref.price != null && ref.price !== '' ? +ref.price : 0;
      const desc = P.id === 'P-MINI-14' ? '14 mini churros con 1 salsa de 38 g a elegir.' : P.id === 'P-CHURRO-INDIVIDUAL' ? 'Churro clásico individual con papel antigrasa.' : `${P.count} churros clásicos con ${sauces} salsa${sauces > 1 ? 's' : ''} de 38 g a elegir.`;
      S.products.push({ id: P.id, extId: P.id, name: P.name, cat: P.cat, price, type: 'momento', sauces, code: P.code, desc, img: '', recipeId: r ? r.id : null, stockItemId: null, active: true, min: 0, sauceGrams: 38, art: P.art, count: P.count, countLabel: P.countLabel || (P.art === 'mini' ? 'minis' : 'churros'), priceTBD: !(price > 0),
        refCost: ref.cost != null && ref.cost !== '' ? +ref.cost : null, refStatus: ref.status || '', refNote: ref.rule || '', src: 'Costos_Referencia' });
      if (r) r.productId = P.id;
      if (r && r.option && r.option.portions !== sauces) rep.warnings.push(`${P.name}: la receta pide ${r.option.portions} salsas y el producto ${sauces}.`);
      rep.products.nuevos.push(P.name + (price > 0 ? ' · ' + money(price) : ' · precio pendiente'));
    }
    // ---- configuración mínima ----
    ['Combos clásicos', 'Mini churros', 'Churros'].forEach(c => { if (!S.config.productCats.includes(c)) S.config.productCats.push(c); });
    if (!S.config.sauceGrams) S.config.sauceGrams = 38;
    S.refCosts = clone(D.refCosts || []);
    if (!S.csValidations) S.csValidations = (D.validations || []).map(v => Object.assign({ done: false }, v));
    // ---- comprobaciones: ciclos/unidades en cada receta importada ----
    S.recipes.filter(r => r.src).forEach(r => { try { expandRecipe(r, 1, []); } catch (e) { rep.errors.push(r.id + ': ' + e.message); } });
    rep.pendingCount = S.items.filter(needsCount).length;
    rep.pendingCost = S.items.filter(costPending).map(i => i.name);
    rep.inferred = S.items.filter(i => i.costStatus === 'inferido').map(i => i.name);
    rep.unapproved = S.recipes.filter(r => !recipeApproved(r)).length;
    rep.changes = rep.items.nuevos.length + rep.recipes.nuevos.length + rep.products.nuevos.length + rep.flavors.nuevos.length + rep.items.vinculados.length + rep.products.vinculados.length + rep.flavors.vinculados.length;
    if (!opt.dry) {
      S.config.migLC = true;
      S.csImport = { source: D.source, version: D.version, ts: Date.now(), mode: rep.mode, by: S.userId, changes: rep.changes };
      audit('importacion', `Importación ${D.source} (${rep.mode === 'replace' ? 'inicio limpio' : 'agregar'}): ${rep.changes} cambios`, { report: { items: rep.items.nuevos.length, recipes: rep.recipes.nuevos.length, products: rep.products.nuevos.length } });
    }
    return rep;
  } finally { if (opt.dry) S = real; }
}

const TYPE_SHORT = { momento: 'Se prepara al vender', elaborado: 'Producto terminado', reventa: 'Reventa' };

function productChecks(p) {
  const rec = p.type === 'momento' && p.recipeId ? recipe(p.recipeId) : null; const it = p.type !== 'momento' && p.stockItemId ? item(p.stockItemId) : null;
  const lines = rec ? recipeCost(rec).lines : []; const cost = productEstCost(p); const pend = productPendingCost(p);
  const priced = x => x.sub ? !!x.subCost && !x.subCost.incomplete && x.unitCost > 0 : (x.unitCost > 0 || !!(x.it && (x.it.costStatus === 'no_material' || !tracked(x.it))));
  return [['Nombre y precio de venta', !!p.name && +p.price > 0, 'info'],
    [p.type === 'momento' ? 'Receta con sus ingredientes' : 'Artículo del inventario asignado', p.type === 'momento' ? !!(rec && rec.lines.length) : !!it, 'receta'],
    ...(rec ? [['Receta aprobada (descuenta sola al vender)', [...recipeTreeIds(rec)].every(id => recipeApproved(recipe(id))), 'receta']] : []),
    ['Todos los ingredientes tienen precio de compra', p.type === 'momento' ? !!(rec && lines.length && lines.every(priced) && !pend.length) : !!(it && itemEstCost(it) > 0 && !costPending(it)), 'receta'],
    ['Costo de producción calculado', cost > 0, 'receta'], ['El precio cubre el costo', cost > 0 && +p.price > cost, 'info'], ['Foto del producto (opcional)', !!p.img, 'info', true]];
}
function productStatus(p) {
  const ch = productChecks(p).filter(c => !c[3]);
  if (p.type === 'momento' && !(p.recipeId && recipe(p.recipeId))) return ['warn', 'Sin receta'];
  if (p.priceTBD && !(+p.price > 0)) return ['warn', 'Precio pendiente'];
  if (p.type === 'momento' && ![...recipeTreeIds(recipe(p.recipeId))].every(id => recipeApproved(recipe(id)))) return ['warn', 'Receta provisional'];
  if (ch.some(c => !c[1])) return ['warn', 'Incompleto'];
  if (p.type === 'momento') return ['ok', 'Listo'];
  if (!p.stockItemId || !item(p.stockItemId)) return ['bad', 'Sin artículo'];
  return ['info', TYPE_SHORT[p.type]];
}

      <div class="rline"><span class="dot" style="background:transparent;border:2px solid var(--fg)"></span><span><b>Ganancia bruta</b><small>Ventas − costo de productos</small></span><b>${money(r.bruta)}</b><span class="tiny muted">${pct(r.bruta / r.ventas)}</span></div>
      <div class="rline"><span class="dot" style="background:var(--warn)"></span><span><b>Gastos</b><small>Luz, gas, transporte, intereses…</small></span><b>−${money(r.gastos)}</b><span class="tiny muted">${pct(r.gastos / r.ventas)}</span></div>

/* ================= COPIAS DE SEGURIDAD · SALSAS (nueva salsa, disponibilidad) ================= */
const BACKUP_FORMAT = 'pos-manager-backup', BACKUP_VER = 1;
const IS_IOS = typeof navigator !== 'undefined' && (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1));
function fnv1a(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return ('0000000' + (h >>> 0).toString(16)).slice(-8); }
function backupCounts(st) {
  const n = k => (st[k] || []).length;
  return { articulos: n('items'), recetas: n('recipes'), productos: n('products'), salsas: n('flavors'), ventas: n('sales'), pedidos: n('orders'), compras: n('purchases'), gastos: n('expenses'), producciones: n('productions'), deudas: n('debts'), clientes: n('customers'), movimientos_inventario: n('inv'), movimientos_dinero: n('moves'),
    imagenes: (st.products || []).filter(p => p.img).length + (st.config && st.config.logo ? 1 : 0) };
}
function buildBackup() {
  const data = JSON.stringify(S);
  const manifest = { format: BACKUP_FORMAT, formatVersion: BACKUP_VER, app: 'POS Manager', business: S.config.name, createdAt: new Date().toISOString(), stateVersion: S.ver,
    components: ['configuración y marca (logo, colores)', 'usuarios', 'artículos e inventario', 'movimientos de inventario', 'recetas y subrecetas', 'salsas', 'productos y fotos', 'clientes y proveedores', 'ventas y pedidos', 'caja y movimientos de dinero', 'compras', 'gastos', 'producción', 'deudas', 'bitácora'],
    counts: backupCounts(S), checksum: 'fnv1a32:' + fnv1a(data), bytes: data.length };
  return '{"manifest":' + JSON.stringify(manifest) + ',"data":' + data + '}';
}
// valida sin tocar los datos actuales
function parseBackup(text) {
  let obj; try { obj = JSON.parse(text); } catch (e) { throw ERR('El archivo no es una copia de seguridad válida (no se pudo leer).'); }
  let data, manifest = null;
  if (obj && obj.manifest && obj.data) {
    manifest = obj.manifest;
    if (manifest.format !== BACKUP_FORMAT) throw ERR('Este archivo no es una copia de seguridad de esta app.');
    if (!(manifest.formatVersion <= BACKUP_VER)) throw ERR('La copia fue hecha con una versión más nueva de la app. Actualiza la app para restaurarla.');
    const i = text.indexOf(',"data":'); const raw = i > 0 ? text.slice(i + 8, text.lastIndexOf('}')) : '';
    if (manifest.checksum && manifest.checksum !== 'fnv1a32:' + fnv1a(raw)) throw ERR('El archivo está dañado o fue modificado (la comprobación de integridad no coincide). No se restauró nada.');
    data = obj.data;
  } else if (obj && obj.ver === 3 && obj.items) data = obj; // copias antiguas (sin manifiesto)
  else throw ERR('El archivo no es una copia de seguridad de esta app.');
  if (!data || data.ver !== 3 || !data.config || !Array.isArray(data.items) || !Array.isArray(data.products) || !Array.isArray(data.sales)) throw ERR('La copia está incompleta: faltan partes esenciales. No se restauró nada.');
  // prueba en un entorno aislado: migrar y calcular el balance
  const old = S; let check;
  try { S = clone(data); migrate(true); const b = balanceSheet(); check = { diff: b.diff, counts: backupCounts(S) }; }
  catch (e) { throw ERR('La copia tiene datos que la app no puede abrir (' + e.message + '). No se restauró nada.'); }
  finally { S = old; }
  return { data, manifest, check, legacy: !manifest };
}
function restorePick(file) {

  const r = new FileReader();

    let P; try { P = parseBackup(String(r.result)); } catch (e) { return openModal({ title: 'No se puede restaurar', body: `<div class="note bad">${esc(e.message)}</div><p class="small muted">Tus datos actuales no se tocaron.</p>`, foot: '<button class="btn pri" data-a="closeModal">Entendido</button>' }); }
    UI.restore = P; const c = P.check.counts, cur = backupCounts(S);
    const rows = [['Artículos', 'articulos'], ['Recetas', 'recetas'], ['Productos', 'productos'], ['Salsas', 'salsas'], ['Ventas', 'ventas'], ['Pedidos', 'pedidos'], ['Gastos', 'gastos'], ['Movimientos de inventario', 'movimientos_inventario'], ['Imágenes y logo', 'imagenes']];
    openModal({ title: 'Restaurar copia de seguridad', size: 'wide', body: `<div class="note ok">Archivo verificado${P.manifest ? ` · formato v${P.manifest.formatVersion} · comprobación de integridad correcta` : ' · copia antigua sin manifiesto'}.</div>
      <div class="kv mt"><dt>Negocio</dt><dd>${esc(P.data.config.name || '—')}</dd><dt>Creada</dt><dd>${P.manifest ? fDT(Date.parse(P.manifest.createdAt)) : (P.data._savedAt ? fDT(P.data._savedAt) : '—')}</dd></div>
      <div class="tblwrap mt"><table class="tbl"><thead><tr><th></th><th class="r">En la copia</th><th class="r">Ahora en el teléfono</th></tr></thead><tbody>${rows.map(([l, k]) => `<tr><td>${l}</td><td class="r b">${c[k]}</td><td class="r">${cur[k]}</td></tr>`).join('')}</tbody></table></div>
      <div class="note warn mt"><b>Se reemplazarán todos los datos actuales</b> por los de la copia (no se mezclan). Si quieres conservar lo de ahora, descarga primero una copia de seguridad del estado actual.</div>`,
      foot: `<button class="btn" data-a="closeModal">Cancelar</button><button class="btn" data-a="backupGo">${ic('download')} Respaldar lo actual primero</button><button class="btn danger solid" data-a="restoreGo">Reemplazar y restaurar</button>` });
  };
  r.onerror = () => toast('No se pudo leer el archivo', 'bad');
  r.readAsText(file);
}

function availTxt(f, grams, short) {
  const a = flavorAvailability(f, grams);
  if (a.status === 'bad' && a.label !== 'Agotada' && !/Agotada|preparar/.test(a.label)) return { a, html: `<span class="bad">${esc(a.label)}</span>` };
  const parts = [];
  if (a.prepared != null) parts.push(`${fmtQty(a.prepared, 'g')} preparada · ${a.preparedPortions} porc.`);
  if (a.potential != null) parts.push(`${a.prepared != null ? 'puedes preparar' : 'alcanza para'} ${a.potential} porc.${short ? '' : ' (potencial)'}`);
  if (a.uncounted.length && a.potential == null && a.prepared == null) parts.push('sin contar: ' + a.uncounted.slice(0, 2).map(esc).join(', ') + (a.uncounted.length > 2 ? '…' : ''));
  const cls = a.status === 'bad' ? 'bad' : a.status === 'warn' ? 'warn' : 'muted';
  return { a, html: `<span class="${cls}">${parts.join(' · ') || esc(a.label)}</span>` };
}

const NATIVE = !!(typeof window !== 'undefined' && window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const blobToB64 = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(b); });

async function nativeSave(filename, data, type) {
  const P = window.Capacitor.Plugins; if (!P.Filesystem || !P.Share) throw new Error('Faltan los complementos de archivos');
  const b64 = await blobToB64(data instanceof Blob ? data : new Blob([data], { type }));
  const w = await P.Filesystem.writeFile({ path: filename, data: b64, directory: 'CACHE' });
  await P.Share.share({ title: filename, text: filename, files: [w.uri], dialogTitle: 'Guardar ' + filename });
  return true;
}

function tabGuardInit() {

    const m = e.data || {}; if (m.from === TAB_ID) return;
    if (m.t === 'hello' && !READONLY) BC.postMessage({ t: 'here', from: TAB_ID });
    if (m.t === 'here' && !READONLY && !UI.tabWarned) { UI.tabWarned = true; openModal({ title: 'La app ya está abierta', body: '<p style="margin-top:0">Está abierta en otra pestaña o ventana. Úsala solo en una a la vez para no perder cambios.</p>', foot: '<button class="btn pri" data-a="tabTakeOver">Usar aquí</button>' }); }

  if (!s) return `<div class="stack"><div class="sect-h"><div><h2>Caja cerrada</h2><p>Abre la caja al iniciar el turno. El saldo inicial es el efectivo que hay en la gaveta.</p></div></div>

  <div class="card"><div class="card-h"><h3>Movimientos del turno</h3><span class="small muted">${rows.length}</span></div>${rows.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>Hora</th><th>Tipo</th><th>Método</th><th>Referencia</th><th>Detalle</th><th class="r">Efectivo</th><th class="r">Banco / otros</th></tr></thead><tbody>${rows.map(m => `<tr><td class="small">${fTime(m.ts)}</td><td>${MOVE_TYPE[m.type] || m.type}</td><td class="small">${esc(methodName(m.method))}</td><td class="small">${esc(m.ref)}</td><td class="small muted">${esc(m.note)}</td><td class="r ${m.account === 'caja' ? (m.amount < 0 ? 'bad' : 'ok') : 'faint'}">${m.account === 'caja' ? money(m.amount) : '—'}</td><td class="r ${m.account === 'banco' ? (m.amount < 0 ? 'bad' : 'ok') : 'faint'}">${m.account === 'banco' ? money(m.amount) : '—'}</td></tr>`).join('')}</tbody></table></div>` : emptyState('cash', 'Sin movimientos todavía', 'Las ventas y gastos de este turno aparecerán aquí.')}</div>${hist}</div>`;

ACT.custPDF = el => { if (!window.jspdf) return toast('No se pudo cargar el generador de PDF. Usa “Copiar estado de cuenta”.', 'bad'); const { c, ss, bal } = custStatement(el.dataset.id); const { jsPDF } = window.jspdf; const doc = new jsPDF({ unit: 'mm', format: 'letter' }); const m = v => money(v).replace('−', '-'); let y = 20;
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text(S.config.name, 15, y); doc.setFontSize(11); doc.setFont('helvetica', 'normal'); doc.text('Estado de cuenta · ' + c.name, 15, y + 7); doc.text(fDate(Date.now()), 200, y, { align: 'right' }); y += 18;
